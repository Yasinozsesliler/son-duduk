name: iOS store listing (metadata + screenshots)

# Uploads the App Store page texts (fastlane/metadata) and screenshots (store/screenshots)
# to App Store Connect with fastlane deliver, using the same API key secrets as ios-release.yml.
# Optionally submits the version for App Review.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App Store sürümü (ios-release ile aynı), örn. 1.0.0"
        required: true
        default: "1.0.0"
      submit:
        description: "Bittikten sonra Apple incelemesine gönder"
        type: boolean
        default: false
      auto_release:
        description: "Onaylanınca otomatik yayınla"
        type: boolean
        default: false
      build:
        description: "İncelemeye gönderilecek build numarası (boş = en son)"
        required: false
        default: ""
      task:
        description: "listing = metin+görsel yükle; release_pending = onaylı sürümü yayınla; status = durum"
        type: choice
        options: [listing, release_pending, status, submit, iap, iap_submit]
        default: listing

jobs:
  listing:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Prepare API key and URLs
        env:
          P8_RAW: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$P8_RAW" ]; then echo "::error::App Store Connect secrets missing (see APP_STORE.md)"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/keys"
          KEYFILE="$RUNNER_TEMP/keys/key.p8"
          if printf '%s' "$P8_RAW" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$P8_RAW" | tr -d '\r' > "$KEYFILE"
          else
            printf '%s' "$P8_RAW" | tr -d ' \r\n\t' | base64 --decode > "$KEYFILE" 2>/dev/null || true
          fi
          if ! openssl pkey -in "$KEYFILE" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8_BASE64 is not a valid .p8 key. Paste either the full .p8 file content (-----BEGIN PRIVATE KEY----- ...) or its base64 text."
            exit 1
          fi
          echo "API key OK"
          ruby -rjson -e 'puts JSON.generate({key_id: ENV["ASC_KEY_ID"], issuer_id: ENV["ASC_ISSUER_ID"], key: File.read(ARGV[0]), in_house: false})' "$KEYFILE" > "$RUNNER_TEMP/keys/api_key.json"
          for pair in tr:tr en:en-US de:de-DE es:es-ES; do
            src="${pair%%:*}"; dst="${pair##*:}"
            mkdir -p "fastlane/screenshots/$dst"
            cp store/screenshots/$src/*.png "fastlane/screenshots/$dst/"
          done
          echo "Destek: $(cat fastlane/metadata/tr/support_url.txt)"

      - name: App Store Connect API task
        if: inputs.task != 'listing'
        run: |
          pip3 install --break-system-packages -q pyjwt cryptography requests || pip3 install -q pyjwt cryptography requests
          if [ "${{ inputs.task }}" = "iap" ]; then ASC_KEY_PATH="$RUNNER_TEMP/keys/key.p8" python3 scripts/asc_iap.py;
          elif [ "${{ inputs.task }}" = "iap_submit" ]; then ASC_KEY_PATH="$RUNNER_TEMP/keys/key.p8" python3 scripts/asc_iap.py submit "${{ inputs.version }}" "${{ inputs.build }}"; else
          ASC_KEY_PATH="$RUNNER_TEMP/keys/key.p8" python3 scripts/asc.py "${{ inputs.task }}" "${{ inputs.version }}" "${{ inputs.build }}"; fi

      - name: Upload listing
        if: inputs.task == 'listing'
        run: |
          BUILD_ARG=""; if [ -n "${{ inputs.build }}" ]; then BUILD_ARG="--build_number ${{ inputs.build }}"; fi
          fastlane deliver $BUILD_ARG \
            --api_key_path "$RUNNER_TEMP/keys/api_key.json" \
            --app_identifier com.sonduduk.hakem \
            --app_version "${{ inputs.version }}" \
            --metadata_path fastlane/metadata \
            --screenshots_path fastlane/screenshots \
            --skip_binary_upload true \
            --overwrite_screenshots true \
            --force true \
            --run_precheck_before_submit false \
            --automatic_release "${{ inputs.auto_release }}" \
            --submit_for_review "${{ inputs.submit }}" \
            --submission_information '{"add_id_info_uses_idfa": false}'

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
