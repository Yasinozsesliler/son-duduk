name: iOS store listing (metadata + screenshots)

# Uploads the App Store page texts (fastlane/metadata) and screenshots (store/screenshots)
# to App Store Connect with fastlane deliver, using the same API key secrets as ios-release.yml.
# Optionally submits the version for App Review.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App Store sürümü (ios-release ile aynı), örn. 1.0.0"
        required: true
        default: "1.0.0"
      submit:
        description: "Bittikten sonra Apple incelemesine gönder"
        type: boolean
        default: false

jobs:
  listing:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Prepare API key and URLs
        env:
          P8_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$P8_B64" ]; then echo "::error::App Store Connect secrets missing (see APP_STORE.md)"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$P8_B64" | base64 --decode > "$RUNNER_TEMP/keys/key.p8"
          ruby -rjson -e 'puts JSON.generate({key_id: ENV["ASC_KEY_ID"], issuer_id: ENV["ASC_ISSUER_ID"], key: File.read(ARGV[0]), in_house: false})' "$RUNNER_TEMP/keys/key.p8" > "$RUNNER_TEMP/keys/api_key.json"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BASE="https://$OWNER.github.io/${{ github.event.repository.name }}"
          echo "$BASE/support.html" > fastlane/metadata/tr/support_url.txt
          echo "$BASE/privacy.html" > fastlane/metadata/tr/privacy_url.txt
          mkdir -p fastlane/screenshots/tr
          cp store/screenshots/*.png fastlane/screenshots/tr/
          echo "Destek: $BASE/support.html"

      - name: Upload listing
        run: |
          fastlane deliver \
            --api_key_path "$RUNNER_TEMP/keys/api_key.json" \
            --app_identifier com.sonduduk.hakem \
            --app_version "${{ inputs.version }}" \
            --metadata_path fastlane/metadata \
            --screenshots_path fastlane/screenshots \
            --skip_binary_upload true \
            --overwrite_screenshots true \
            --force true \
            --run_precheck_before_submit false \
            --automatic_release false \
            --submit_for_review "${{ inputs.submit }}" \
            --submission_information '{"add_id_info_uses_idfa": false}'

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
