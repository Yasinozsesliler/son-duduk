name: Android build

# Debug APK only (compile check / install on a phone). Signed Google Play builds: android-release.yml

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install and build web bundle
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Debug APK (install directly on a phone)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 7
          name: son-duduk-android
          path: |
            android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
