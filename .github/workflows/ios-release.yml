name: iOS release (TestFlight / App Store)

# Builds a signed release on a macOS runner and uploads it to App Store Connect.
# Signing is automatic (cloud-managed) via an App Store Connect API key, so no
# certificates or provisioning profiles need to be exported from a Mac.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID         10-character Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID            App Store Connect API key ID
#   ASC_ISSUER_ID         App Store Connect API issuer ID
#   ASC_KEY_P8_BASE64     The downloaded AuthKey_XXXX.p8 file, base64-encoded
# See APP_STORE.md for step-by-step instructions.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Sürüm numarası (App Store'da görünen), örn. 1.0.0"
        required: true
        default: "1.0.0"

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "::error::$v secret is missing (see APP_STORE.md)"; exit 1; fi
          done
          if [ -z "${{ secrets.ASC_KEY_P8_BASE64 }}" ]; then echo "::error::ASC_KEY_P8_BASE64 secret is missing"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build web app and sync iOS project
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Install App Store Connect API key
        env:
          P8_RAW: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEYFILE="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          if printf '%s' "$P8_RAW" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$P8_RAW" | tr -d '\r' > "$KEYFILE"
          else
            printf '%s' "$P8_RAW" | tr -d ' \r\n\t' | base64 --decode > "$KEYFILE" 2>/dev/null || true
          fi
          if ! openssl pkey -in "$KEYFILE" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8_BASE64 is not a valid .p8 key. Paste either the full .p8 file content (-----BEGIN PRIVATE KEY----- ...) or its base64 text."
            exit 1
          fi
          echo "API key OK"
          echo "ASC_KEY_PATH=$KEYFILE" >> "$GITHUB_ENV"

      - name: Archive (unsigned; App Store signing happens at export via cloud signing)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="${{ inputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive

      - name: Export and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Yüklendi: sürüm ${{ inputs.version }} (build ${{ github.run_number }}). App Store Connect → TestFlight'ta 10-30 dk içinde görünür."

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
