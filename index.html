function radarSVG(vals){ const keys=Object.keys(ATTR_NAMES), n=keys.length, R=96, C=120; const pt=(i,r)=>{ const a=-Math.PI/2+i*2*Math.PI/n; return [C+Math.cos(a)*r,C+Math.sin(a)*r*.96]; };
  const ring=f=>keys.map((k,i)=>pt(i,R*f).join(',')).join(' ');
  const poly=keys.map((k,i)=>pt(i,R*clamp(vals[k],0,99)/99).join(',')).join(' ');
  return `<svg viewBox="-30 -8 300 256" class="radar" role="img" aria-label="Nitelik grafiği">${[.25,.5,.75,1].map(f=>`<polygon points="${ring(f)}" fill="none" stroke="rgba(236,234,226,${f===1?.22:.09})"/>`).join('')}
    ${keys.map((k,i)=>{ const p=pt(i,R); return `<line x1="${C}" y1="${C}" x2="${p[0]}" y2="${p[1]}" stroke="rgba(236,234,226,.08)"/>`; }).join('')}
    <polygon points="${poly}" fill="rgba(242,194,48,.22)" stroke="#f2c230" stroke-width="2.2" stroke-linejoin="round"/>
    ${keys.map((k,i)=>{ const p=pt(i,R*clamp(vals[k],0,99)/99); return `<circle cx="${p[0]}" cy="${p[1]}" r="3.6" fill="#f2c230"/>`; }).join('')}
    ${keys.map((k,i)=>{ const p=pt(i,R+16); return `<text x="${p[0]}" y="${p[1]-2}" text-anchor="middle" class="rd-l">${Math.round(vals[k])}</text><text x="${p[0]}" y="${p[1]+11}" text-anchor="middle" class="rd-n">${esc(ATTR_NAMES[k])}</text>`; }).join('')}</svg>`; }

function afterMatchExtras(report,fx){
  try{
    S.museum=S.museum||[];
    M.cardsLog.filter(c=>c.red).forEach(c=>{ const t=c.side===0?M.H:M.A, o=c.side===0?M.A:M.H; S.museum.unshift({l:c.label,t:t.name,o:o.name,min:c.min,s:S.season,comp:fx.compName}); });
    if(S.museum.length>60) S.museum.length=60;
    if(!M.auto&&M.cardsLog.some(c=>c.red)&&fx.imp>=3&&chance(.3)){
      const f=engage(1500); S.social.followers+=f;
      addPost({a:{n:'Tribün Kamerası',h:'@tribunkamerasi',role:'Futbol videoları',v:0},text:`${S.name} kırmızı kartı öyle bir gösterdi ki sosyal medya yıkıldı. Herkes "Refmania pozu"nu deniyor. #RefmaniaPozu`,likes:engage(5000),rts:engage(2200),aboutMe:true});
      setTimeout(()=>toast('Viral oldun! Kart gösterişin dolaşıyor · Takipçi +'+f),1200);
    }
    if(report.clubComplaint){ const st=storyEnsure(); if(!st.done.mektup&&!st.q.some(x=>x.id==='mektup')&&chance(.6)) st.q.push({id:'mektup',at:S.season*100+S.week+1}); }
    if(M.favSide!=null){
      const fs=M.favSide; const errs=M.log.filter(d=>d.cat==='major'&&(d.v==='hata'||d.v==='israr')&&d.harmed!=null);
      const pro=errs.filter(d=>d.harmed===1-fs).length, con=errs.filter(d=>d.harmed===fs).length;
      const N=S.neutral=S.neutral||{n:0,pro:0,con:0}; N.n++; N.pro+=pro; N.con+=con;
      if(pro>con){ S.kurul.trust=clamp(S.kurul.trust-3,0,100); addPost({a:PRESS[1],text:`${S.name} tuttuğu takımın maçında hatalarını hep aynı tarafa yaptı. Tesadüf mü? #hakem`,likes:engage(900),rts:engage(300),aboutMe:true}); }
      else if(!errs.length) S.rep=clamp(S.rep+1,0,100);
    }
  }catch(e){}
}
// ---------- Hakem Raporu: pozisyon türüne göre karar istatistiği (ayrıntısı Premium) ----------
const OKV=['dogru','kabul','durdu'], BADV=['hata','israr','var'];
function dstatAdd(log){
  try{ S.dstat=S.dstat||{}; S.derr=S.derr||[];
    (log||[]).filter(d=>d.cat==='major'&&d.type&&d.v).forEach(d=>{
      const o=S.dstat[d.type]=S.dstat[d.type]||{n:0,ok:0,half:0}; o.n++;
      if(OKV.includes(d.v)) o.ok++; else if(d.v==='kismen') o.half++;
      if(BADV.includes(d.v)) S.derr.unshift({type:d.type,min:d.min,season:S.season,week:S.week,your:d.your,correct:d.correct,law:String(d.law||'').slice(0,240)});
    });
    if(S.derr.length>8) S.derr.length=8;
  }catch(e){}
}
function dAcc(o){ return o.n?(o.ok+o.half*.5)/o.n:0; }
function proReportHTML(){
  const st=S.dstat||{}; const rows=Object.keys(st).map(k=>({k,t:TYPE_TITLES[k]||k,n:st[k].n,a:dAcc(st[k])})).sort((a,b)=>b.n-a.n);
  const tot=rows.reduce((x,r)=>x+r.n,0);
  const head=`<div class="dv-ph"><h3>Hakem Raporu</h3>${isPremium()?'<span class="chip pro-chip">PRO</span>':'<span class="chip">Özet</span>'}</div>`;
  if(tot<3) return `<section class="dv-panel pro">${head}<p class="muted">Birkaç maç yönettikten sonra hangi pozisyonlarda iyi, hangilerinde zayıf olduğunu burada göreceksin.</p></section>`;
  const all=rows.reduce((x,r)=>x+r.a*r.n,0)/tot; const pct=v=>Math.round(v*100)+'%';
  const ranked=rows.filter(r=>r.n>=2).sort((a,b)=>a.a-b.a); const weak=ranked.slice(0,3), best=ranked[ranked.length-1];
  const summary=`<div class="pro-sum"><div><b class="num">${pct(all)}</b><small>Genel doğruluk</small></div><div><b class="num">${tot}</b><small>Önemli karar</small></div>${best?`<div><b>${esc(best.t)}</b><small>En güçlü olduğun pozisyon</small></div>`:''}</div>`;
  const bar=r=>`<div class="pro-row"><span>${esc(r.t)}</span><i class="pro-bar"><i style="width:${Math.round(r.a*100)}%;background:${r.a>=.8?'var(--green)':r.a>=.6?'var(--yellow)':'var(--red)'}"></i></i><b class="num">${pct(r.a)}</b><small class="num">${r.n}</small></div>`;
  if(!isPremium()){
    const teaser=rows.slice(0,4).map(bar).join('');
    return `<section class="dv-panel pro">${head}${summary}<div class="pro-lockw"><div class="pro-rows pro-blur" aria-hidden="true">${teaser}</div>
      <div class="pro-lock">${v11g('crown','#f6c62b',30)}<b>Ayrıntılı rapor Premium’da</b><small>Pozisyon türüne göre doğruluk, zayıf noktaların ve kural maddeleri.</small><button class="btn primary" data-paywall="rapor">Raporu aç</button></div></div></section>`;
  }
  const errs=(S.derr||[]).slice(0,5);
  return `<section class="dv-panel pro">${head}${summary}
    <div class="pro-rows">${rows.map(bar).join('')}</div>
    ${weak.length&&weak[0].a<.8?`<h4 class="pro-h">Üzerinde çalışman gerekenler</h4><div class="pro-weak">${weak.filter(r=>r.a<.8).map(r=>`<details class="law"><summary><b>${esc(r.t)}</b> · ${pct(r.a)}</summary><p>${esc(LAWS[r.k]||'')}</p></details>`).join('')}</div>`:''}
    ${errs.length?`<h4 class="pro-h">Son hataların</h4><div class="pro-errs">${errs.map(e=>`<div class="pro-err"><b>${esc(TYPE_TITLES[e.type]||e.type)}</b><small>${esc(e.min||'')} · ${esc(seasonLabel(e.season))}</small><span>Senin kararın: ${esc(e.your||'—')}</span><span>Doğrusu: ${esc(e.correct||'—')}</span></div>`).join('')}</div>`:''}
  </section>`;

function dayNo(k){ const [y,m,d]=k.split('-').map(Number); return Math.round((Date.UTC(y,m-1,d)-DAILY_EPOCH)/864e5)+1; }

function dailyMake(k,practice){
  const seed=hash('refmania-daily-'+k+(practice?'-'+practice+'-'+Date.now():''));
  const r0=seeded(seed); const types=dailyTypes(); const type=types[Math.floor(r0()*types.length)];
  const nts=NATIONS.slice(0,32); const a=Math.floor(r0()*nts.length); let b=Math.floor(r0()*nts.length); if(b===a) b=(a+7)%nts.length;

function activeItems11(){
  const best={}, out=[];
  (S.inv||[]).map(itemById11).filter(Boolean).forEach(it=>{ if(!it.grp) out.push(it); else if(!best[it.grp]||best[it.grp].lv<it.lv) best[it.grp]=it; });

function effChips(it){
  const out=[]; const m=it.mod||{};

  if(m.vis) out.push(`+%${Math.round(m.vis*100)} görüş`);
  if(m.temp) out.push(`−%${Math.round(m.temp*100)} maç gerginliği`);
  if(m.en) out.push(`−${m.en} maç yorgunluğu`);
  if(m.rest) out.push(`+${m.rest} haftalık enerji`);
  if(m.train) out.push(`+%${Math.round(m.train*100)} antrenman`);
  if(it.rep) out.push(`+${it.rep} itibar`);

  if(it.fol) out.push(`+${compactNum(it.fol)} takipçi`);

function adWeek(){ const now=Date.now(); const L=lsJ(ADLOG_KEY,{r:[],i:[]}); const r=(L.r||[]).filter(t=>now-t<7*DAY1).length, i=(L.i||[]).filter(t=>now-t<7*DAY1).length; return {n:r+i,min:Math.max(1,Math.round((r*30+i*15)/60))}; }
function pwStatHTML(){ if(isPremium()) return ''; const w=adWeek(); if(w.n<3) return ''; return `<span class="pw-stat">Son 7 günde <b class="num">${w.n}</b> reklam izledin, yaklaşık <b class="num">${w.min}</b> dakika. Premium ile hepsi biter.</span>`; }
function noteRewardedWatched(){
  SESSION_RW++; adLog('r');
  if(noteHourAd()) return;
  OFF.rw++; offSave();
  if(OFF.rw>=10 && Date.now()-OFF.rw10>7*DAY1 && !SESSION_OFFER){ OFF.rw10=Date.now(); OFF.rw=0; offSave(); setTimeout(()=>openOffer('reklam10','milestone'),1500); }
  else if(SESSION_RW===3) setTimeout(()=>openOffer('reklam'),1500);
}
function noteInterstitialShown(){
  OFF.ints++; offSave(); adLog('i');
  if(isPremium()||SESSION_OFFER||Date.now()-OFF.nudge<DAY1) return;
  OFF.nudge=Date.now(); offSave();
  setTimeout(()=>{ const t=$('#toast'); if(!t) return; const d=document.createElement('div'); d.className='pw-nudge'; d.innerHTML=`<span>${v11g('crown','#f6c62b',22)}</span><b>Reklamsız oyna</b><button class="btn sm primary" type="button">Paketler</button>`; d.querySelector('button').onclick=()=>{ d.remove(); openPaywall('nudge'); }; t.appendChild(d); setTimeout(()=>d.remove(),7000); },900);
}

const HOUR_KEY='refmania_saat', HOUR_GOAL=10, HOUR_LEN=20*60000;
let HOUR=lsJ(HOUR_KEY,{n:0,hak:false,bitis:0,teklif:false});
function hourSave(){ lsSet(HOUR_KEY,JSON.stringify(HOUR)); }
function hourActive(now=Date.now()){ return !!HOUR.bitis && now<HOUR.bitis; }
function noteHourAd(){
  if(isPremium()||HOUR.hak||hourActive()) return false;
  HOUR.n++; if(HOUR.n<HOUR_GOAL){ hourSave(); return false; }

}
function startHour(){ if(!HOUR.hak||hourActive()) return; HOUR.hak=false; HOUR.bitis=Date.now()+HOUR_LEN; HOUR.teklif=false; hourSave(); haptic('success'); toast('Premium Molası başladı: 20 dakika reklamsız'); render(); }

function storyEnsure(){ if(!S.story) S.story={cur:null,done:{},q:[],n:0}; return S.story; }
function storyWeek(){
  const st=storyEnsure(); if(S.ended) return;
  if(S.aile!=null){ S.energy=clamp(S.energy+Math.round((S.aile-60)/20),0,100); if(S.aile<35&&!st.done.aile_kriz&&!st.q.some(x=>x.id==='aile_kriz')) st.q.push({id:'aile_kriz',at:S.season*100+S.week}); }
  const wk=S.season*100+S.week;
  const due=st.q.findIndex(x=>x.at<=wk);
  if(st.cur) return;
  if(due>=0){ const id=st.q[due].id; st.q.splice(due,1); if(!st.done[id]&&STORIES[id]){ st.cur={id}; return; } }
  if(S.bribe&&S.bribe.offer) return;
  if(!chance(.32)) return;
  const pool=Object.entries(STORIES).filter(([k,v])=>!v.chain&&!st.done[k]&&v.when());
  if(!pool.length) return; st.cur={id:wpick(pool.map(([k,v])=>[k,v.w]))};
}
function storyEff(e){ const out=[];
  if(e.rep){ S.rep=clamp(S.rep+e.rep,0,100); out.push('İtibar '+(e.rep>0?'+':'')+e.rep); }
  if(e.trust&&S.kurul){ S.kurul.trust=clamp(S.kurul.trust+e.trust,0,100); out.push('Kurul güveni '+(e.trust>0?'+':'')+e.trust); }
  if(e.energy){ S.energy=clamp(S.energy+e.energy,0,100); out.push('Enerji '+(e.energy>0?'+':'')+e.energy); }
  if(e.fol&&S.social){ S.social.followers=Math.max(50,S.social.followers+e.fol); out.push('Takipçi '+(e.fol>0?'+':'')+e.fol); }
  if(e.money){ tx('Kişisel',e.money,e.money>0?'odul':'diger'); S.money=Math.max(0,S.money+e.money); }
  if(e.attr) for(const k in e.attr){ S.attrs[k]=clamp(S.attrs[k]+e.attr[k],0,99); out.push(ATTR_NAMES[k]+' +'+e.attr[k]); }
  if(e.susp&&S.bribe) S.bribe.susp=clamp(S.bribe.susp+e.susp,0,100);
  if(e.suspend) S.suspended=Math.max(S.suspended||0,e.suspend);
  if(e.aile){ S.aile=clamp((S.aile??70)+e.aile,0,100); out.push('Aile '+(e.aile>0?'+':'')+e.aile); }
  return out; }
function storyChoice(cid){
  const st=storyEnsure(); if(!st.cur) return; const E=STORIES[st.cur.id]; const c=E.ch.find(x=>x.id===cid); if(!c) return;
  let msg=c.t||''; const fx=storyEff(c.e||{});
  if(c.risk){ const p=c.riskF?c.riskF():c.risk[0]; if(chance(p)){ fx.push(...storyEff(c.risk[1])); msg=c.risk[2]; } else msg=c.risk[3]; }

function pxC(hex,k){ // k<1 koyulaştır, k>1 aç
  const n=parseInt(hex.slice(1),16); let r=n>>16&255,g=n>>8&255,b=n&255;
  if(k>1){ const t=Math.min(1,k-1); r+=(255-r)*t; g+=(255-g)*t; b+=(255-b)*t; } else { r*=k; g*=k; b*=k; }
  return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
}
const PXL=(id,stops,x1=0,y1=0,x2=0,y2=1)=>`<linearGradient id="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">${stops.map(s=>`<stop offset="${s[0]}" stop-color="${s[1]}"${s[2]!=null?` stop-opacity="${s[2]}"`:''}/>`).join('')}</linearGradient>`;

function pxImg(kind,p,key){
  const k=key||kind+JSON.stringify(p); let u=PX_CACHE.get(k);

// ---------- yardımcılar ----------
function pk(r,a){ return a[Math.floor(r()*a.length)]; }
function pc(r){ const c=PH_COLS[Math.floor(r()*PH_COLS.length)]; return {id:c[0],n:c[1],h:c[2]}; }
function lumC(hex){ const n=parseInt(hex.slice(1),16); return ((n>>16&255)*.299+(n>>8&255)*.587+(n&255)*.114)/255; }
function phMetalName(m){ const x=PH_METALS.find(a=>a[0]===m); return x?x[1]:''; }
function phNice(v){ // insan eli değmiş fiyatlar: 349 · 1.249 · 12.500 · 340.000
  if(v<100) return Math.max(9,Math.round(v/10)*10-1);
  if(v<10000) return Math.round(v/50)*50-1;
  if(v<100000) return Math.round(v/500)*500;
  const p=Math.pow(10,Math.floor(Math.log10(v))-1); return Math.round(v/p)*p;
}
// ---------- katalog üretimi (deterministik; kayda girmez) ----------
let PH_CAT=null, PH_CATMAP=null;
function phCatalog(){
  if(PH_CAT) return PH_CAT;
  const out=[]; const segsFor=L=>L<=1?['eko','eko','orta']:L<=3?['eko','orta','orta','luks']:L<=4?['orta','luks','luks']:['orta','luks','luks','luks'];
  for(let L=0;L<=6;L++){
    PH_CATS.forEach(c=>{
      if(!c.n||(c.minL||0)>L||(c.maxL!=null&&c.maxL<L)) return;
      const r=seeded(hash(c.id+'|'+L)); const segs=segsFor(L).filter(s=>c.brands[s]&&c.brands[s].length);
      if(!segs.length) return;
      const count=c.n*2+(L>=2?2:0)+(L>=4?2:0);
      for(let i=0;i<count;i++){
        const seg=segs[i%segs.length]; const brand=pk(r,c.brands[seg]); const model=pk(r,c.ser)+(r()<.6?' '+(1+Math.floor(r()*9))+(r()<.3?'0':''):'');
        const ctx={brand,model}; const p=c.gen(r,seg,ctx); const art=p.art||c.art;
        const price=phNice(c.base*PH_LVLM[L]*PH_SEGM[seg]*(.75+r()*.6));
        const id='k'+L+'_'+c.id.slice(2)+'_'+i;
        out.push({id,cat:'katalog',kc:c.id,dept:c.dept,lvl:L,seg,brand,model,name:brand+' '+model,art,p,price,
          sub:c.sub?c.sub(p):'',kind:c.name,stars:3.8+r()*1.2,rev:Math.round(20+r()*(seg==='luks'?400:4000)),
          moral:seg==='luks'?4+L*.5:seg==='orta'?2.5+L*.3:1.5,
          rep:seg==='luks'?Math.round((.2+L*.06)*10)/10:0,
          fol:Math.round((seg==='luks'?60:seg==='orta'?20:5)*(1+L*.9)*(['moda','saat'].includes(c.dept)?1.4:1))});
      }
    });
  }
  PH_MODELS.forEach(m=>{ if(!m.price) return; out.push({id:m.id,cat:'katalog',kc:'c_telefon',dept:'elek',lvl:m.lvl,seg:m.seg,brand:m.brand,model:m.model,name:m.brand+' '+m.model,art:'phone',
    p:{c1:m.frame,c2:m.wall[0],cam:m.cam,notch:m.cut==='ada'||m.cut==='tepe',rad:Math.round(m.rad/3)},price:m.price,sub:'Oyundaki telefonun olur',kind:'Akıllı telefon',stars:4.3+(m.lvl%3)*.2,rev:900+m.lvl*700,moral:m.seg==='luks'?5:3,rep:m.seg==='luks'?.3:0,fol:m.fol,phone:m.id}); });
  out.forEach(it=>{ it.img=()=>pxImg(it.art,it.p,it.id); if(it.seg==='luks'&&it.lvl>=1&&hash(it.id+'pex')%5===0) it.pex=1; if(it.id==='m_aurum') it.pex=1; });
  PH_CAT=out; PH_CATMAP=new Map(out.map(x=>[x.id,x]));
  return out;
}
function catById(id){ if(!PH_CATMAP) phCatalog(); return PH_CATMAP.get(id)||PH_ESTMAP().get(id)||null; }

PH_VIEWS.takvim=()=>{

  const months=[]; for(let w=1;w<=34;w++){ const d=weekDateObj(w); const k=d.getFullYear()+'-'+d.getMonth(); let g=months[months.length-1]; if(!g||g.k!==k){ g={k,y:d.getFullYear(),m:d.getMonth(),ws:[]}; months.push(g); } g.ws.push(w); }
  const today=weekDateObj(Math.min(34,Math.max(1,cur)));
  const html=months.map(g=>{ const first=new Date(g.y,g.m,1); const days=new Date(g.y,g.m+1,0).getDate(); const off=(first.getDay()+6)%7;
    const marks={}; g.ws.forEach(w=>{ const d=weekDateObj(w); const hs=hist.filter(h=>h.week===w); marks[d.getDate()]={w,state:w<cur?'past':w===cur?'now':'fut',r:hs.length?Math.max(...hs.map(h=>h.rating)):null}; });
    let cells=''; for(let i=0;i<off;i++) cells+='<span></span>';
    for(let d=1;d<=days;d++){ const mk=marks[d]; const isT=today.getFullYear()===g.y&&today.getMonth()===g.m&&today.getDate()===d; cells+=`<span class="${isT?'td':''} ${mk?'mk '+mk.state:''}">${d}${mk?`<i style="${mk.r!=null?'background:'+rateCol(mk.r):''}"></i>`:''}</span>`; }
    const list=g.ws.map(w=>{ const d=weekDateObj(w); const hs=hist.filter(h=>h.week===w); const T=w===cur&&S.tasks?S.tasks.matches.filter(m=>!m.played):[];

function phHubTile(){ if(!S) return ''; phEnsure(); const P=S.ph; const u=phUnread();
  let last=null,lw=null; for(const k in P.th){ const t=P.th[k]; const m=t[t.length-1]; if(m&&m.f==='them'&&(!last||m.w>=last.w)){ last=m; lw=k; } }
  const c=lw?phContact(lw):null; const mo=phMoral();
  return `<button class="tile t-phone" id="tPhone"><span class="qtp-ic">${phIcon('mesaj',44)}${u?`<i class="qb">${u}</i>`:''}</span><span class="qtp-t"><span class="t-h">Telefonun</span><small>${c?`<b>${esc(c.n)}:</b> ${esc(last.t.length>60?last.t.slice(0,58)+'…':last.t)}`:'Mesajlar, alışveriş, takvim'}</small></span><span class="qtp-mo"><small>Moral</small><b class="num" style="color:${mo>=70?'#3fd18a':mo>=45?'#f6c62b':'#ff6b6b'}">${mo}</b></span></button>`; }
function phDecorate(){
  if(!S) return; phEnsure();
  const bn=document.querySelector('.bnav'); const u=phUnread();
  if(bn&&!bn.querySelector('#bPhone')) bn.insertAdjacentHTML('beforeend',`<button id="bPhone" aria-label="Telefon"><span class="qbp-ic"><svg viewBox="0 0 24 24" class="ic"><rect x="6.5" y="2.5" width="11" height="19" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10.5 18.5h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>${u?`<i class="qb">${u}</i>`:''}</span><span>Telefon</span></button>`);
  const w=$('#bWallet'); if(w&&!document.querySelector('.hs-phone')) w.insertAdjacentHTML('afterend',`<button class="hstat hs-phone" id="bPhoneTop" aria-label="Telefon"><svg viewBox="0 0 24 24" class="ic"><rect x="6.5" y="2.5" width="11" height="19" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10.5 18.5h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>${u?`<i class="qb">${u}</i>`:''}</button>`);
  const sh=document.querySelector('.v11-shophead'); if(sh&&!document.querySelector('.qx-shop')) sh.insertAdjacentHTML('afterend',`<button class="qx-shop" id="bPhShop">${phIcon('sepet',40)}<span><b>Telefonundaki Sepet’te yüzlerce ürün</b><small>Saat, moda, elektronik, ev, araba ve deneyimler. Kademen yükseldikçe yenileri açılır.</small></span><i>›</i></button>`);
  const ps=$('#bPhShop'); if(ps) ps.onclick=()=>phOpen('sepet');
  document.querySelectorAll('#bPhone,#bPhoneTop,#tPhone').forEach(b=>b.onclick=()=>phOpen());
  if(PH.open) phRender();
}

// ---------- boot ----------
document.body.classList.add('sg');
function pauseForBackground(){
  HIDDEN_AT=Date.now();
  if(M && !M.done && !M.auto && !M.paused && $('#bPause')){ M.paused=true; $('#bPause').textContent='Devam'; }
  if(S) save();
}
function resumeFromBackground(){ if(HIDDEN_AT && TIMER) TIMER_T0+=Date.now()-HIDDEN_AT; HIDDEN_AT=0; }
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pauseForBackground(); else resumeFromBackground(); });
function handleBack(){
  if(PH.open&&$('#modal').hidden) return phBack();
  if(!$('#modal').hidden) return;                       // decisions cannot be skipped
  const ov=$('#overlay');
  if(!ov.hidden){
    if($('#bBack')) return $('#bBack').click();          // pre-match: leave
    if($('#bDone')) return $('#bDone').click();          // report: continue
    if(M && !M.done && $('#bPause')) return $('#bPause').click(); // live match: pause/resume
    return;
  }
  if(S && TAB!=='merkez'){ TAB='merkez'; render(); return; }
  const A=PLUG('App'); if(A) A.minimizeApp ? A.minimizeApp() : A.exitApp();
}
async function nativeInit(){
  if(!CAP) return;
  try{ const P=PLUG('Preferences'); if(P){ for(const k of [OLD_KEY,slotKey(1),slotKey(2),slotKey(3),slotKey(4)]){ const r=await P.get({key:k}); if(r && r.value) NSAVE[k]=r.value; }
    try{ if(!lsGet(DAILY_KEY)){ const r=await P.get({key:DAILY_KEY}); if(r && r.value) localStorage.setItem(DAILY_KEY,r.value); } }catch(e){} } }catch(e){}
  try{ const A=PLUG('App'); if(A){ A.addListener('backButton',handleBack); A.addListener('pause',pauseForBackground); A.addListener('resume',resumeFromBackground); } }catch(e){}
  try{ const SB=PLUG('StatusBar'); if(SB){ SB.setStyle({style:'DARK'}); SB.setBackgroundColor && SB.setBackgroundColor({color:'#101824'}); } }catch(e){}
  try{ const SP=PLUG('SplashScreen'); if(SP) setTimeout(()=>SP.hide(),250); }catch(e){}
}
async function boot(data){
  try{ if(window.__SD_PRE) await window.__SD_PRE; }catch(e){}
  await nativeInit(); migrateOld();
  if(data && data.save){ S=migrateSave(data.save); SLOT=S.slot||1; ensureRegistry(); }
  render();
}
window.claude?.hot?.snapshot?.(()=>({save:S}));
if(window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? {});
</script>
