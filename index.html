<title>Refmania</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: floodlit night-match app shell. Sticky scoreboard bar, side nav (bottom tabs on phones), one main column.
   Matches open as a full-screen broadcast overlay; incidents open as a referee's review sheet over it. */
:root{
  --bg:#0c121b; --bg2:#101824; --panel:#152030; --panel2:#1b293c; --line:#263851; --line2:#33496a;
  --fg:#e8eef4; --muted:#8b9bb0; --dim:#5f7088;
  --yellow:#f6c62b; --yellow-ink:#231a00; --red:#e3434b; --green:#38b27a; --blue:#5b9bff; --amber:#f29b38;
  --pitch:#1b5a3d; --pitch2:#1f6444; --chalk:#e9f1ea;
  --f-display:'Saira Condensed','Arial Narrow',sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg2)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:disabled{cursor:not-allowed;opacity:.45}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;width:100%}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance;line-height:1.1}
h2{font-size:24px;text-transform:uppercase}
h3{font-size:18px;text-transform:uppercase;letter-spacing:.05em}
p{margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2);font-weight:600;transition:background .15s,border-color .15s,transform .1s}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow);font-family:var(--f-display);font-size:17px;letter-spacing:.06em;text-transform:uppercase;font-weight:800}
.btn.primary:hover:not(:disabled){filter:brightness(1.07)}
.btn.danger{border-color:var(--red);color:#ffd6d8}
.btn.sm{padding:6px 10px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.chip.y{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow)}
.chip.g{color:var(--green);border-color:color-mix(in srgb,var(--green) 50%,transparent)}
.chip.r{color:#ff9aa0;border-color:color-mix(in srgb,var(--red) 55%,transparent)}
.chip.b{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 50%,transparent)}
.chip.a{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 50%,transparent)}
.kit{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(255,255,255,.25);flex:none}
.mini-card{display:inline-block;width:9px;height:12px;border-radius:2px;vertical-align:-1px}
.mini-card.y{background:var(--yellow)} .mini-card.r{background:var(--red)}

/* ---------- top bar & shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg2);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:16px;min-height:58px;flex-wrap:wrap;padding-block:6px}
.brand{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand svg{width:26px;height:26px}
.top-stats{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap;align-items:center}
.ts{display:flex;flex-direction:column;line-height:1.1}
.ts b{font-family:var(--f-mono);font-size:14px;font-weight:600}
.ts span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:196px minmax(0,1fr);gap:24px;padding-block:20px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.side{display:flex;flex-direction:column;gap:2px;position:sticky;top:80px;align-self:start}
nav.side button{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;padding:10px 12px;border-radius:8px;color:var(--muted);font-weight:600}
nav.side button:hover{background:var(--panel)}
nav.side button.on{background:var(--panel2);color:var(--fg);box-shadow:inset 3px 0 0 var(--yellow)}
nav.side .badge{background:var(--yellow);color:var(--yellow-ink);border-radius:999px;font-size:11px;padding:0 7px;font-weight:700}
main{min-width:0;display:flex;flex-direction:column;gap:20px}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.side{position:fixed;left:0;right:0;bottom:0;top:auto;flex-direction:row;overflow-x:auto;background:var(--bg2);border-top:1px solid var(--line);z-index:45;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav.side button{flex:none;font-size:13px;padding:8px 10px}
  nav.side button.on{box-shadow:inset 0 -3px 0 var(--yellow)}
  .top-stats{gap:12px}
}

/* ---------- hub ---------- */
.hub{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px}
@media (max-width:1020px){.hub{grid-template-columns:minmax(0,1fr)}}
.weekhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.fx{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.fx.big{border-color:color-mix(in srgb,var(--yellow) 45%,var(--line))}
.fx .teams{font-family:var(--f-display);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fx .vs{color:var(--dim);font-size:15px}
.fx .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.fx .act{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.fx{grid-template-columns:1fr}.fx .act{justify-content:flex-start}}
.rate-pill{font-family:var(--f-mono);font-weight:600;font-size:20px;padding:4px 10px;border-radius:8px;background:var(--bg2);border:1px solid var(--line2)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.act-b{text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;gap:2px}
.act-b b{font-size:14px}
.act-b span{font-size:12px;color:var(--muted)}
.act-b:hover:not(:disabled){border-color:var(--line2)}
.act-b.on{border-color:var(--yellow);background:color-mix(in srgb,var(--yellow) 10%,var(--bg2))}
.bar{height:6px;border-radius:99px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.attr{display:grid;grid-template-columns:110px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}
.attr .num{text-align:right}
.spark{width:100%;height:46px;display:block}
.news{display:flex;flex-direction:column;gap:0}
.news button{text-align:left;padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.news button:last-child{border-bottom:0}
.news b{font-size:14px}
.next-step{border-left:3px solid var(--yellow);padding:4px 0 4px 12px}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.me td{background:color-mix(in srgb,var(--yellow) 8%,transparent)}

/* ---------- career ladder ---------- */
.ladder{display:flex;flex-direction:column;gap:0}
.rung{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 0;position:relative}
.rung .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);background:var(--bg);margin:3px 0 0 6px;position:relative;z-index:1}
.rung::before{content:"";position:absolute;left:13px;top:0;bottom:0;width:2px;background:var(--line)}
.rung:first-child::before{top:14px}.rung:last-child::before{bottom:calc(100% - 14px)}
.rung.done .dot{background:var(--green);border-color:var(--green)}
.rung.cur .dot{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 0 4px color-mix(in srgb,var(--yellow) 25%,transparent)}
.rung b{font-family:var(--f-display);font-size:17px;text-transform:uppercase;letter-spacing:.03em}
.rung .req{font-size:12px;color:var(--muted)}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.trophy{padding:10px 12px;border-radius:10px;border:1px dashed var(--line2);color:var(--dim);font-size:13px}
.trophy.on{border-style:solid;border-color:color-mix(in srgb,var(--yellow) 60%,transparent);color:var(--fg);background:color-mix(in srgb,var(--yellow) 7%,transparent)}
.trophy b{display:block;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.04em;font-size:15px}

/* ---------- start screen ---------- */
.start{min-height:100%;display:grid;place-items:start center;padding-block:40px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:
  radial-gradient(1200px 500px at 50% -10%, color-mix(in srgb,var(--pitch2) 55%,transparent), transparent 70%), var(--bg)}
.start-in{width:min(1040px,100%);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px}
@media (max-width:860px){.start-in{grid-template-columns:minmax(0,1fr)}}
.logo{font-family:var(--f-display);font-weight:800;font-size:clamp(54px,9vw,96px);line-height:.88;text-transform:uppercase;letter-spacing:.01em}
.logo span{color:var(--yellow)}
.lede{font-size:17px;color:var(--muted);max-width:52ch;margin-top:14px}
.opt-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;text-align:left;background:var(--bg2);display:flex;flex-direction:column;gap:2px}
.opt.on{border-color:var(--yellow);background:color-mix(in srgb,var(--yellow) 9%,var(--bg2))}
.opt b{font-size:14px}.opt span{font-size:12px;color:var(--muted)}
label.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;display:block;margin-bottom:6px}
.path{display:flex;flex-direction:column;gap:6px;margin-top:22px}
.path div{display:flex;gap:10px;align-items:baseline;font-size:14px}
.path i{font-style:normal;font-family:var(--f-mono);color:var(--yellow);font-size:12px;min-width:22px}

/* ---------- match overlay ---------- */
.ov{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov-in{max-width:1180px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.board{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:14px;padding:14px 18px;border-radius:14px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line2)}
.board .tm{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:clamp(17px,2.6vw,28px);text-transform:uppercase;min-width:0}
.board .tm.r{justify-content:flex-end;text-align:right}
.board .tm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .kitb{width:16px;height:30px;border-radius:4px;flex:none;border:1px solid rgba(255,255,255,.3)}
.score{display:flex;flex-direction:column;align-items:center;gap:2px}
.score .sc{font-family:var(--f-mono);font-weight:600;font-size:clamp(28px,4vw,40px);letter-spacing:.04em}
.score .clk{font-family:var(--f-mono);font-size:13px;background:var(--yellow);color:var(--yellow-ink);padding:1px 8px;border-radius:4px;font-weight:600}
.score.flash .sc{animation:flash 1s ease}
@keyframes flash{0%,100%{color:var(--fg)}30%{color:var(--yellow)}}
.mbody{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
@media (max-width:900px){.mbody{grid-template-columns:minmax(0,1fr)}}
.feed{display:flex;flex-direction:column;gap:0;max-height:min(62vh,640px);overflow:auto;padding:4px 14px}
.feed .ln{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;animation:in .3s ease}
.feed .ln .m{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.feed .ln.goal{background:color-mix(in srgb,var(--green) 10%,transparent)}
.feed .ln.goal b{color:var(--green)}
.feed .ln.dec{background:color-mix(in srgb,var(--yellow) 7%,transparent)}
.feed .ln.sys{color:var(--muted);font-style:italic}
@keyframes in{from{opacity:.2;transform:translateY(-4px)}to{opacity:1;transform:none}}
.gauge{display:flex;flex-direction:column;gap:6px}
.gauge .bar{height:10px}
.temp i{background:linear-gradient(90deg,var(--green),var(--amber),var(--red))}
.ctl{display:flex;gap:6px;flex-wrap:wrap}
.ctl .btn.on{border-color:var(--yellow);color:var(--yellow)}

/* ---------- modal / incident sheet ---------- */
.modal{position:fixed;inset:0;z-index:90;background:rgba(4,8,14,.78);backdrop-filter:blur(3px);overflow:auto;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.sheet{max-width:980px;margin:0 auto;background:var(--panel);border:1px solid var(--line2);border-radius:16px;overflow:hidden;animation:rise .25s ease}
.sheet.narrow{max-width:560px}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.sh-head{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 16px;background:var(--panel2);border-bottom:1px solid var(--line2);flex-wrap:wrap}
.sh-head h2{font-size:22px}
.sh-body{padding:16px;display:flex;flex-direction:column;gap:14px}
.timer{height:5px;background:var(--bg2)}
.timer i{display:block;height:100%;background:var(--yellow);width:100%;transition:width .1s linear}
.timer.low i{background:var(--red)}
.inc{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px}
@media (max-width:780px){.inc{grid-template-columns:minmax(0,1fr)}}
.story{font-size:16px;line-height:1.55}
.story b{color:var(--yellow)}
.pitchbox{border-radius:10px;overflow:hidden;border:1px solid var(--line2);background:var(--pitch)}
svg.pitch{display:block;width:100%;height:auto}
.facts{display:flex;flex-direction:column;gap:6px}
.fact{display:grid;grid-template-columns:132px minmax(0,1fr);gap:10px;padding:7px 10px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);font-size:14px}
.fact .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.fact.obs{border-style:dashed;border-color:var(--amber)}
.fact.obs .v{color:var(--amber)}
.fact.rev{border-color:var(--blue)}
@media (max-width:480px){.fact{grid-template-columns:92px minmax(0,1fr);gap:8px;padding:6px 8px;font-size:13px}.fact .k{font-size:10px;letter-spacing:.04em}.story{font-size:15px}.facts{gap:4px}}
.decide{display:flex;flex-direction:column;gap:10px}
.dopts{display:flex;flex-wrap:wrap;gap:8px}
.dopt{padding:10px 14px;border-radius:9px;border:1px solid var(--line2);background:var(--bg2);font-weight:600;text-align:left}
.dopt:hover{border-color:var(--muted)}
.dopt.on{border-color:var(--yellow);background:color-mix(in srgb,var(--yellow) 14%,var(--bg2));color:var(--fg)}
.cards{display:flex;gap:10px;flex-wrap:wrap}
.cbtn{width:84px;min-height:100px;border-radius:9px;padding:8px;display:flex;flex-direction:column;justify-content:flex-end;font-size:12px;font-weight:700;text-align:left;border:2px solid transparent;transition:transform .12s}
.cbtn.none{background:var(--bg2);border:2px dashed var(--line2);color:var(--muted)}
.cbtn.y{background:var(--yellow);color:var(--yellow-ink)}
.cbtn.r{background:var(--red);color:#fff}
.cbtn:hover{transform:translateY(-2px) rotate(-1.5deg)}
.cbtn.on{outline:3px solid var(--fg);outline-offset:2px;transform:translateY(-4px) rotate(-3deg)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.lawbox{font-size:13px;line-height:1.5;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--blue) 9%,var(--bg2));border:1px solid color-mix(in srgb,var(--blue) 40%,transparent)}
.verdict{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2)}
.verdict .vi{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.v-dogru .vi,.v-durdu .vi{color:var(--green)} .v-kabul .vi{color:var(--blue)} .v-kismen .vi,.v-var .vi{color:var(--amber)} .v-hata .vi,.v-israr .vi{color:var(--red)}
.monitor{border:8px solid #05080c;border-radius:14px;box-shadow:0 0 0 1px var(--line2);position:relative}
.monitor::after{content:"VAR · OFR";position:absolute;top:8px;left:10px;font-family:var(--f-mono);font-size:11px;background:#05080c;color:var(--yellow);padding:2px 6px;border-radius:3px}
.varpulse{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.06em;padding:30px 0;justify-content:center}
.varpulse i{width:14px;height:14px;border-radius:50%;background:var(--blue);animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--blue) 70%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
.posopts{display:flex;flex-direction:column;gap:8px}
.posopt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2)}
.posopt .L{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:var(--bg);font-weight:800;font-family:var(--f-display)}
.posopt:hover{border-color:var(--yellow)}
.numgrid{display:flex;gap:8px;flex-wrap:wrap}
.numgrid .btn{min-width:56px;font-family:var(--f-mono);font-size:18px}
.stoplist{display:flex;flex-direction:column;gap:4px;font-size:14px}
.stoplist div{display:flex;justify-content:space-between;gap:10px;padding:5px 10px;background:var(--bg2);border-radius:6px}

/* ---------- report ---------- */
.rep-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:640px){.rep-top{grid-template-columns:1fr}}
.bignote{font-family:var(--f-mono);font-weight:600;font-size:76px;line-height:1;letter-spacing:-.02em}

/* ===== v4: premium layer ===== */
:root{--bg:#070b12;--bg2:#0b111b;--panel:#0e1623;--panel2:#152033;--line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.13);--gold1:#ffdb5c;--gold2:#ec9f17;--glass:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.012));--lift:inset 0 1px 0 rgba(255,255,255,.06),0 24px 60px -30px rgba(0,0,0,.85)}
body{background:radial-gradient(1100px 620px at 88% -12%,rgba(246,198,43,.075),transparent 62%),radial-gradient(1000px 760px at -12% 8%,rgba(32,101,69,.2),transparent 62%),radial-gradient(900px 600px at 50% 120%,rgba(53,101,196,.1),transparent 60%),var(--bg)}
.panel{background:var(--glass),var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--lift)}
h3{font-size:17px;letter-spacing:.08em}
.page-title{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:.01em}
.page-title .muted{font-size:.55em;font-weight:600;letter-spacing:.06em;margin-left:6px}
.eyebrow.gold{color:var(--gold1);display:inline-flex;align-items:center;gap:8px}
.eyebrow.gold::before{content:"";width:16px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--gold1),var(--gold2))}
.btn{background:var(--glass),var(--panel2);border:1px solid var(--line2);border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.btn:hover:not(:disabled){border-color:rgba(255,255,255,.28);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02)),var(--panel2)}
.btn.primary{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--gold1),var(--gold2));border:0;color:#211600;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 30px -10px rgba(240,165,25,.65);text-shadow:0 1px 0 rgba(255,255,255,.35)}
.btn.primary::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);transition:left .6s ease}
.btn.primary:hover:not(:disabled)::after{left:130%}
.btn.primary:disabled{background:var(--panel2);color:var(--dim);box-shadow:none;text-shadow:none;opacity:1;border:1px solid var(--line)}
.btn.lg{padding:15px 30px;font-size:20px;border-radius:14px}
.top{background:rgba(7,11,18,.7);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
body::before{background:rgba(7,11,18,.92)}
.hstat{background:var(--glass),rgba(14,22,35,.7);border-color:var(--line);border-radius:14px}
.hdr-right>.me{background:var(--glass),rgba(21,32,51,.8);border-color:var(--line2)}
.av{background:linear-gradient(135deg,var(--gold1),var(--gold2));box-shadow:0 0 0 2px rgba(7,11,18,.9),0 0 0 3px rgba(255,219,92,.45)}
nav.side button{border-radius:12px;transition:background .15s,color .15s}
nav.side button:hover{background:rgba(255,255,255,.04)}
nav.side button.on{background:linear-gradient(90deg,rgba(255,219,92,.16),rgba(255,219,92,0));box-shadow:inset 2px 0 0 var(--gold1);color:var(--fg)}
.chip{border-color:var(--line2);background:rgba(255,255,255,.03)}
.chip.y{background:linear-gradient(180deg,var(--gold1),var(--gold2));color:#211600;border:0}
main>*{animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both}
main>*:nth-child(2){animation-delay:.05s}main>*:nth-child(3){animation-delay:.1s}
@keyframes fadeUp{from{opacity:.25;transform:translateY(8px)}to{opacity:1;transform:none}}
/* match hero */
.mhero{position:relative;border-radius:26px;overflow:hidden;border:1px solid var(--line2);box-shadow:0 40px 90px -40px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.08);isolation:isolate;background:#05080d}
.mhero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-2;display:block}
.mhero-shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(7,11,18,.55) 0%,rgba(7,11,18,.05) 30%,rgba(7,11,18,.25) 55%,rgba(7,11,18,.93) 86%,rgba(7,11,18,.98) 100%)}
.mhero-in{display:flex;flex-direction:column;justify-content:space-between;gap:18px;padding:18px 22px 22px;min-height:min(420px,70vh)}
.mhero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mhero-comp{font-family:var(--f-display);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:13px;color:#d5dde8;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.mhero-teams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}
.mh-t{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-width:0}

.mh-t b{font-family:var(--f-display);font-weight:800;font-size:clamp(19px,3vw,32px);text-transform:uppercase;line-height:1;letter-spacing:.01em;text-shadow:0 3px 16px rgba(0,0,0,.9);overflow-wrap:anywhere}
.mh-t small{color:#b9c4d2;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.mh-vs{display:flex;flex-direction:column;align-items:center;gap:4px}

.mhero-bot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mh-meta{display:flex;gap:16px;flex-wrap:wrap;color:#c3ccd8;font-size:13.5px;align-items:center}
.mh-meta b{color:var(--fg);font-family:var(--f-mono);font-weight:600}
.mh-done{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.mh-done h3{font-size:clamp(22px,3vw,30px);letter-spacing:.04em}
.mh-res{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.mh-res span{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(7,11,18,.7);border:1px solid var(--line2);font-size:13px}
@media (max-width:560px){.mhero-in{padding:14px 14px 16px;min-height:340px}.mhero-bot{flex-direction:column;align-items:stretch}.mhero-bot .row{justify-content:stretch}.mhero-bot .btn.primary{flex:1}}
/* training cards */
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.tcard{display:grid;grid-template-columns:38px minmax(0,1fr);grid-template-rows:auto auto auto;column-gap:10px;row-gap:2px;align-items:center;text-align:left;padding:12px;border-radius:16px;background:var(--glass),var(--bg2);border:1px solid var(--line);transition:transform .18s,border-color .18s,box-shadow .18s}
.tcard .aic{grid-row:1/3;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(180deg,rgba(91,155,255,.22),rgba(91,155,255,.08));color:#9cc2ff}
.tcard b{font-size:14.5px}
.tcard .muted{font-size:12px;line-height:1.3}
.tcard .gains{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.gchip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:rgba(56,178,122,.13);color:#7fe0b2;white-space:nowrap}
.gchip.neg{background:rgba(242,155,56,.12);color:#f7b56b}.gchip.pos{background:rgba(91,155,255,.14);color:#9cc2ff}
.tcard:hover:not(:disabled){transform:translateY(-3px);border-color:var(--line2);box-shadow:0 16px 30px -18px rgba(0,0,0,.9)}
.tcard.on{border-color:var(--gold1);background:linear-gradient(180deg,rgba(255,219,92,.14),rgba(255,219,92,.03)),var(--bg2);opacity:1}
.tcard.on .aic{background:linear-gradient(180deg,var(--gold1),var(--gold2));color:#211600}
.tcard:disabled:not(.on){opacity:.4}
@media (max-width:560px){.tcards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tcard{grid-template-columns:30px minmax(0,1fr);padding:10px;column-gap:8px}.tcard .aic{width:30px;height:30px;border-radius:9px;grid-row:1/2}.tcard .aic .ic{width:17px;height:17px}.tcard>.muted{display:none}.tcard b{font-size:13.5px;line-height:1.15}.tcard .gains{margin-top:6px;gap:4px}.gchip{font-size:10.5px;padding:2px 6px}}
/* fixtures, kpis, profile */
.fxc{border-radius:20px;border-color:var(--line);background:var(--glass),var(--panel);box-shadow:var(--lift)}
.kpis>div{background:var(--glass),rgba(7,11,18,.5);border-color:var(--line);border-radius:14px}
.profile{position:relative;overflow:hidden}
.profile::before{content:"";position:absolute;inset:0 0 auto 0;height:120px;background:radial-gradient(420px 120px at 20% 0%,rgba(255,219,92,.12),transparent);pointer-events:none}
.bar{background:rgba(255,255,255,.06);border:0}
.bar i{background:linear-gradient(90deg,#3f7ef0,#7fb0ff)}
.next-step{border-left:0;padding:12px 14px;border-radius:14px;background:linear-gradient(90deg,rgba(255,219,92,.12),rgba(255,219,92,.02));box-shadow:inset 2px 0 0 var(--gold1)}
.alert{border-radius:18px}
/* report */
.rring{position:relative;width:148px;height:148px;flex:none}
.rring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rring circle{fill:none;stroke-width:9}

.rring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rring-in b{font-family:var(--f-mono);font-weight:600;font-size:44px;line-height:1;letter-spacing:-.02em}
.rring-in small{font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.rgrade{font-family:var(--f-display);font-weight:800;font-size:28px;text-transform:uppercase;letter-spacing:.03em}
/* start */
.start{position:relative;isolation:isolate;background:var(--bg)}
.start-bg{position:fixed;inset:0;width:100%;height:100%;z-index:-2;display:block}
.wiz{background:rgba(11,20,17,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:10px}
.start::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(7,11,18,.94) 0%,rgba(7,11,18,.7) 45%,rgba(7,11,18,.55) 100%),linear-gradient(0deg,rgba(7,11,18,.9),transparent 50%)}
.start .panel{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02)),rgba(11,17,27,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.logo span{background:linear-gradient(180deg,var(--gold1),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.opt{border-radius:14px;background:var(--glass),rgba(7,11,18,.55)}
.opt.on{border-color:var(--gold1);background:linear-gradient(180deg,rgba(255,219,92,.14),rgba(255,219,92,.02)),rgba(7,11,18,.55)}
/* match screen polish */
.stage{border-radius:22px;box-shadow:0 30px 80px -40px rgba(0,0,0,.95)}
.mbar{background:var(--glass),var(--panel);border-radius:18px}
.sheet{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0)),var(--panel);border-radius:22px;box-shadow:0 40px 100px -30px rgba(0,0,0,.95)}
.sh-head{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01)),var(--panel2)}
.dopt{border-radius:12px;background:var(--glass),var(--bg2);border-color:var(--line2)}
.dopt.on{border-color:var(--gold1);background:linear-gradient(180deg,rgba(255,219,92,.18),rgba(255,219,92,.05)),var(--bg2)}
.cbtn{border-radius:12px;box-shadow:0 10px 24px -12px rgba(0,0,0,.8)}
.cbtn.y{background:linear-gradient(160deg,#ffe27a,#f2b51e)}.cbtn.r{background:linear-gradient(160deg,#ff6b72,#d12f39)}
.fact{background:var(--glass),rgba(7,11,18,.45);border-radius:12px}

@media (max-width:560px){.slot{grid-template-columns:56px minmax(0,1fr);gap:12px;padding:14px}.slot-av,.slot-av .avsvg{width:56px;height:56px}.slot-act{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}.slot-act .btn.primary{flex:1}.feat span{font-size:12px;padding:6px 10px}}

/* ===== v1.2: gelişim ve antrenman ===== */
.dv{display:grid;gap:14px}
.dv-hero{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:24px;align-items:center;padding:22px;background:radial-gradient(500px 260px at 15% 50%,rgba(242,194,48,.08),transparent 70%),var(--panel);border:1px solid var(--line);border-radius:10px}
.dv-radar{position:relative}
.radar{width:100%;height:auto;display:block}
.rd-l{font:800 13px var(--f-body);fill:#ecebe4}
.rd-n{font:600 9.5px var(--f-body);fill:#98a79f}
.dv-ovr{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;pointer-events:none}
.dv-ovr b{font:850 46px/1 var(--f-display);font-stretch:68%;color:var(--fg);text-shadow:0 2px 12px rgba(0,0,0,.6)}
.dv-ovr small{font-size:11.5px;color:var(--muted);font-weight:600}
.dv-id{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:center}
.dv-av{width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--panel2);grid-row:span 1}
.dv-id h2{font-size:32px;margin:0}
.dv-note{grid-column:1/-1;color:var(--muted);font-size:14px;margin-top:10px;max-width:52ch}
.dv-id .btn{grid-column:1/-1;justify-self:start;margin-top:6px}
.dv-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.dv-a{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
.dv-ah{display:flex;align-items:center;gap:8px}
.dv-ic{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:rgba(242,194,48,.12);color:var(--yellow)}
.dv-ic svg{width:16px;height:16px}
.dv-an{font-size:13px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv-ah b{font:850 30px/1 var(--f-display);font-stretch:70%}
.dv-seg{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.dv-seg i{height:6px;border-radius:1px;background:linear-gradient(90deg,var(--yellow) calc(var(--f)*100%),rgba(236,234,226,.1) calc(var(--f)*100%))}
.dv-af{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.dv-af small{color:var(--muted);font-size:12px;line-height:1.4}
.dv-af .num{font-weight:800;font-size:13px;color:var(--dim)}
.dv-af .num.up{color:var(--green)}
.dv-af em{font-style:normal;font-weight:500;font-size:11.5px;color:var(--muted);margin-left:5px}
.dv-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:14px}
.dv-panel{display:flex;flex-direction:column;gap:14px;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.dv-ph{display:flex;justify-content:space-between;align-items:center}
.dv-ph h3{margin:0;font-size:22px}
.dv-cefr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.dv-step{position:relative;display:grid;gap:3px;padding:12px 10px;background:var(--bg2);border:1px solid var(--line);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%,10px 50%)}
.dv-step:first-child{clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%)}
.dv-step b{font:850 22px/1 var(--f-display);font-stretch:72%;padding-left:6px}
.dv-step small{font-size:11px;color:var(--muted);padding-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv-step.done{background:rgba(79,181,134,.16)}
.dv-step.cur{background:var(--yellow);color:var(--yellow-ink)}
.dv-step.cur small{color:var(--yellow-ink)}
.dv-staff{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dv-st{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:10px;background:var(--bg2);border:1px solid var(--line);border-radius:8px}
.dv-st svg{width:96px;height:64px;border-radius:5px;display:block}
.dv-stb{display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:0}
.dv-stb b{font-size:14.5px}
.dv-stb small{font-size:12px;color:var(--muted);line-height:1.35}
.dv-stb .btn,.dv-stb .chip{margin-top:auto}
.dv-st.own{border-color:rgba(79,181,134,.5);box-shadow:inset 3px 0 0 var(--green)}
@media (max-width:1100px){.dv-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.dv-two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){.dv-hero{grid-template-columns:minmax(0,1fr);padding:16px}.dv-radar{max-width:280px;margin:0 auto;width:100%}.dv-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.dv-staff{grid-template-columns:minmax(0,1fr)}.dv-id h2{font-size:26px}.dv-grid{grid-template-columns:minmax(0,1fr)}.dv-a{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}}
/* antrenman kartları yeni palet */
.trw{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.trw-h h3{font-stretch:72%;text-transform:none}
.tr{background:var(--bg2);border-color:var(--line);border-radius:8px}
.tr-k{font-family:var(--f-body);letter-spacing:0;text-transform:none;font-weight:700;font-size:11.5px}
.tr-n{font-stretch:72%;font-size:19px}
.tr-g span{text-transform:none;letter-spacing:0;font-size:11.5px}
.tr-g b{font-family:var(--f-body);color:var(--fg)}
.tr-g b.hi{color:var(--green)}
.tr-i{text-transform:none;letter-spacing:0;border-top-color:var(--line)}
.tr-i .num{font-family:var(--f-body)}
.tr-sel{border-radius:4px;color:#0a0f0d;font-family:var(--f-body)}
.tr:not([disabled]):hover{transform:translateY(-2px)}

/* ===== v1.2: üst çubuk ve cüzdan ===== */
.top{background:linear-gradient(180deg,rgba(14,25,21,.96),rgba(10,19,16,.9));backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border-bottom:1px solid rgba(236,234,226,.07);box-shadow:0 1px 0 rgba(242,194,48,.06)}
.brand span{font:850 23px/1 var(--f-display);font-stretch:66%;letter-spacing:-.01em}
.hdr-right{gap:0;background:rgba(236,234,226,.04);border:1px solid rgba(236,234,226,.09);border-radius:14px;padding:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.hstat{background:transparent;border:0;border-radius:10px;height:42px;position:relative;color:var(--fg);font:inherit}
.hstat+.hstat::before,.hdr-right>.me::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:1px;background:rgba(236,234,226,.1)}
.hdr-right>.me{position:relative;background:transparent;border:0;margin-left:2px}
.hstat b{font:800 17px/1 var(--f-display);font-stretch:74%}
.hstat small{font-size:10.5px;color:var(--muted);font-weight:600}
.hs-money{cursor:pointer;background:linear-gradient(180deg,rgba(242,194,48,.16),rgba(242,194,48,.06));box-shadow:inset 0 0 0 1px rgba(242,194,48,.28);margin:0 3px}
.hs-money:hover{background:linear-gradient(180deg,rgba(242,194,48,.24),rgba(242,194,48,.1))}
.hs-money::before{display:none}
.hs-money b{color:#ffe08a}
.hs-ic.gold{color:var(--yellow)}
.wl{max-width:560px}
.wl-body{display:grid;gap:16px}
.wl-card{position:relative;overflow:hidden;border-radius:16px;padding:20px 22px;min-height:180px;display:flex;flex-direction:column;gap:4px;color:#f6f2e4;
  background:radial-gradient(420px 220px at 110% -20%,rgba(242,194,48,.55),transparent 60%),radial-gradient(300px 200px at -10% 120%,rgba(79,181,134,.35),transparent 60%),linear-gradient(135deg,#17261f,#0c1512 60%,#16201b);
  box-shadow:0 24px 50px -24px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.08)}
.wl-card::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(120deg,rgba(255,255,255,.035) 0 2px,transparent 2px 16px);pointer-events:none}
.wl-ct{display:flex;justify-content:space-between;align-items:center;margin-bottom:auto}
.wl-brand{position:relative;padding-right:.5em;font:850 22px/1 var(--f-display);font-stretch:66%}
.wl-brand i{position:absolute;right:0;top:.04em;width:.3em;height:.42em;background:#f2c230;border-radius:.04em;transform:rotate(12deg)}
.wl-chip{width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#f6d66a,#b88a12);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.wl-card small{font-size:12px;opacity:.75;font-weight:600;margin-top:14px}
.wl-bal{font:850 clamp(34px,7vw,44px)/1 var(--f-display);font-stretch:70%;letter-spacing:-.01em}
.wl-cb{display:flex;justify-content:space-between;gap:10px;font-size:12px;opacity:.8;margin-top:10px;text-transform:uppercase;letter-spacing:.06em}
.wl-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wl-sum div{display:grid;gap:2px;padding:12px;background:var(--bg2);border:1px solid var(--line);border-radius:8px}
.wl-sum small{font-size:11.5px;color:var(--muted)}
.wl-sum b{font:800 20px/1 var(--f-display);font-stretch:74%}
.pos{color:var(--green)} .neg{color:var(--red)}
.wl-sec{display:grid;gap:10px}
.wl-sec h3{margin:0;font-size:18px}
.wl-chart{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;height:120px;align-items:end;padding:8px;background:var(--bg2);border:1px solid var(--line);border-radius:8px}
.wl-col{position:relative;height:100%;display:flex;gap:2px;align-items:flex-end;justify-content:center;padding-bottom:16px}
.wl-col span{width:40%;min-height:1px;border-radius:2px 2px 0 0}
.wl-in{background:var(--green)} .wl-out{background:var(--red)}
.wl-col small{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:10px;color:var(--dim)}
.wl-leg{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.wl-leg i,.wl-cats i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.wl-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.wl-bar i{display:block;height:100%}
.wl-cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;font-size:13px}
.wl-cats span{display:flex;align-items:center}
.wl-cats b{margin-left:auto;font-size:13px}
.wl-tx{display:grid}
.wl-t{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.wl-ti{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.wl-tl{display:grid;min-width:0}
.wl-tl b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl-tl small{font-size:11.5px;color:var(--muted)}
.wl-t>b{font-size:14px}
@media (max-width:440px){.hstat b{font-size:15px}.hdr-right{padding:2px;border-radius:12px}.wl-sum b{font-size:17px}}

/* ===== v1.2: paketler (Premium / Tam Paket) ===== */
.pw{max-width:760px;border-color:rgba(242,194,48,.28)}
.pw-hero{position:relative;text-align:center;padding:26px 22px 20px;display:grid;justify-items:center;gap:6px;
  background:radial-gradient(520px 240px at 50% -40%,rgba(242,194,48,.35),transparent 70%),radial-gradient(400px 200px at 0% 120%,rgba(79,181,134,.18),transparent 70%),linear-gradient(180deg,#14231d,#0d1713)}
.pw-hero.sm{padding:18px 16px 14px;border-radius:12px;margin-bottom:14px}
.pw-hero h2{margin:4px 0 0;font:850 clamp(28px,5vw,40px)/1 var(--f-display);font-stretch:68%;letter-spacing:-.01em}
.pw-hero p{margin:0;color:var(--muted);max-width:44ch}
.pw-brand{position:relative;padding-right:.5em;font:850 18px/1 var(--f-display);font-stretch:66%;color:var(--fg);opacity:.85}
.pw-brand i{position:absolute;right:0;top:.04em;width:.3em;height:.42em;background:#f2c230;border-radius:.04em;transform:rotate(12deg)}
.pw-x{position:absolute;right:10px;top:8px;width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.07);color:var(--fg);font-size:26px;line-height:1;cursor:pointer}
.pw-dealchip{margin-top:6px;padding:6px 12px;border-radius:999px;background:rgba(242,194,48,.14);color:#ffe08a;font-size:13px;box-shadow:inset 0 0 0 1px rgba(242,194,48,.35)}
.pw-body{gap:14px}
.pw-grid{display:grid;grid-template-columns:1.12fr 1fr;gap:12px;align-items:stretch}
.pw-card{position:relative;display:flex;flex-direction:column;gap:12px;padding:18px 16px 16px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.pw-tam{background:linear-gradient(180deg,rgba(242,194,48,.13),rgba(242,194,48,.03) 55%),var(--bg2);border:1.5px solid rgba(242,194,48,.6);box-shadow:0 18px 40px -22px rgba(242,194,48,.45)}
.pw-ribbon{position:absolute;top:-11px;left:16px;padding:4px 10px;border-radius:999px;background:#f2c230;color:#1a1405;font-size:12px;font-weight:800}
.pw-card header{display:grid;gap:2px}
.pw-card header b{font:850 26px/1 var(--f-display);font-stretch:70%}
.pw-card header small{color:var(--muted);font-size:13px}
.pw-perks{list-style:none;margin:0;padding:0;display:grid;gap:10px;flex:1}
.pw-perks li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start}
.pw-perks b{display:block;font-size:14.5px}
.pw-perks small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.pw-timer{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:10px;background:rgba(0,0,0,.25);font-size:13px;color:#ffe08a}
.pw-timer b{font:800 17px/1 var(--f-display);font-stretch:80%}
.pw-buy{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px}
.pw-buy em{font-style:normal;font-weight:700;opacity:.9}
.pw-buy *{white-space:nowrap}
.pw-buy .num{font:850 20px/1 var(--f-display);font-stretch:78%}
.pw-buy s{opacity:.55;font-weight:600;font-size:14px}
.pw-prem .pw-buy{background:rgba(255,255,255,.06)}
.pw-foot{margin:0;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.5}
.linkbtn{background:none;border:0;padding:0;color:var(--fg);text-decoration:underline;font:inherit;cursor:pointer}
.pw-owned{display:grid;justify-items:center;gap:6px;padding:10px;text-align:center}
.pw-owned b{font:850 24px/1 var(--f-display);font-stretch:70%}
.pw-kits h3{margin:4px 0 10px}
.pw-kitrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.pw-kit{display:grid;justify-items:center;gap:6px;padding:10px 12px;min-width:84px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);color:var(--fg);cursor:pointer;font:inherit;font-size:13px}
.pw-kit i{width:36px;height:40px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--k) 0 64%,var(--s) 64%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.pw-kit.on{border-color:#f2c230;box-shadow:inset 0 0 0 1px #f2c230}
.pw-dealrow{box-shadow:inset 0 0 0 1.5px rgba(242,194,48,.6)}
.pw-hour{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg2);border:1px solid var(--line)}
.pw-hour b{display:block;font-size:14px}.pw-hour small{color:var(--muted);font-size:12.5px}
.pw-hour.ready,.pw-hour.on{border-color:rgba(242,194,48,.45);background:linear-gradient(90deg,rgba(242,194,48,.12),transparent),var(--bg2)}
.pw-hbar{grid-column:1/-1;display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.pw-hbar i{display:block;height:100%;background:#f2c230}
.pw-upsell{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:10px;align-items:center;margin:12px 0;padding:12px;border-radius:12px;background:linear-gradient(90deg,rgba(242,194,48,.12),transparent),var(--bg2);border:1px solid rgba(242,194,48,.35)}
.pw-upsell b{display:block}.pw-upsell small{color:var(--muted);font-size:12.5px}
.pw-nudge{display:flex;align-items:center;gap:10px;pointer-events:auto}
.pw-nudge b{flex:1}
@media (max-width:640px){.pw-grid{grid-template-columns:1fr}.pw-upsell{grid-template-columns:30px minmax(0,1fr)}.pw-upsell .btn{grid-column:span 1}}

/* Rahat mod */
.fact.key{border-color:rgba(242,194,48,.45)}
.fact .kx{display:block;margin-top:3px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--yellow)}
.more-facts summary{cursor:pointer;color:var(--muted);font-size:13px;padding:4px 2px}
.more-facts .fact{margin-top:6px;opacity:.85}
.hint{font-size:13px;color:var(--muted);padding:8px 10px;border-radius:6px;background:var(--bg2);box-shadow:inset 3px 0 0 var(--blue)}
/* Günün pozisyonu */
.t-prem{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;min-height:0;padding:14px 16px;text-align:left;background:linear-gradient(110deg,rgba(242,194,48,.26),rgba(242,194,48,.06) 55%,rgba(242,194,48,.14)),var(--panel);border:1px solid rgba(242,194,48,.7);box-shadow:0 0 0 1px rgba(242,194,48,.15),0 10px 30px rgba(242,194,48,.10)}
.t-prem .pm-t{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:3px}.t-prem .t-h{color:#f6c62b}.t-prem small{color:var(--fg);opacity:.82;font-size:13px;line-height:1.3;font-weight:500;text-transform:none;letter-spacing:0}
.t-prem .pm-go{flex:none;padding:9px 14px;border-radius:10px;background:#f2c230;color:#14110a;font-weight:800;font-size:15px}
.t-prem.deal{animation:pmGlow 2.4s ease-in-out infinite}@keyframes pmGlow{50%{box-shadow:0 0 0 1px rgba(242,194,48,.5),0 10px 34px rgba(242,194,48,.28)}}
.t-hourw{grid-column:1/-1}.t-hourw .pw-hour{margin:0}
.hs-prem{border:1px solid rgba(242,194,48,.55)!important;background:rgba(242,194,48,.10)!important;cursor:pointer}.hs-prem b{color:#f6c62b}
.v11-shopoffer .v11-premrow{width:100%}.v11-tabs .tab-prem{color:#f6c62b;font-weight:800;display:inline-flex;align-items:center;gap:5px}
.t-daily{grid-column:1/-1;flex-direction:row;align-items:center;gap:16px;min-height:0;padding:14px 16px;background:linear-gradient(90deg,rgba(242,194,48,.13),rgba(242,194,48,.02) 60%),var(--panel);border-color:rgba(242,194,48,.45)}
.t-daily.done{background:var(--panel);border-color:var(--line)}
.dy-no{font:850 40px/1 var(--f-display);font-stretch:66%;color:var(--yellow);min-width:64px}
.dy-t{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.dy-fire{font-weight:700;font-size:14px;white-space:nowrap}
.dy-go{background:var(--yellow);color:var(--yellow-ink);font:800 17px/1 var(--f-display);font-stretch:72%;text-transform:uppercase;padding:10px 16px;border-radius:6px;white-space:nowrap}

@font-face{font-family:'Archivo';src:url(fonts/archivo-latin-wdth-normal.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

/* ===== TELEFON ===== */
#phone{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(3,6,12,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));animation:phIn .22s ease-out}

body.ph-on{overflow:hidden}

.ph-scr.old{border-top:22px solid #0b0c0e;border-bottom:26px solid #0b0c0e}

.ph-sb{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;height:44px;padding:4px 26px 0;font-size:14px;flex:none}

/* 1.5: görsel katman */
.tunnel{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(circle at 50% 55%,#2a3a2a 0%,#0b0f0b 45%,#000 75%);overflow:hidden;animation:tnIn .4s ease both}
.tunnel .tn-light{position:absolute;left:50%;top:55%;width:40vmin;height:40vmin;transform:translate(-50%,-50%) scale(.2);border-radius:50%;background:radial-gradient(circle,#fff 0%,#e9ffe0 25%,rgba(180,255,170,.35) 50%,transparent 70%);animation:tnLight 2.4s cubic-bezier(.5,0,.2,1) forwards}
.tunnel .tn-txt{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:18px 26px;border-radius:18px;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);text-shadow:0 2px 14px rgba(0,0,0,.8);animation:tnTxt 2.4s ease forwards}
.tunnel .tn-txt b{font-family:var(--f-display);font-size:clamp(30px,8vw,54px);text-transform:uppercase;letter-spacing:.03em;line-height:1}
.tunnel .tn-txt small{color:rgba(255,255,255,.75);font-size:15px}
.tunnel.out{animation:tnOut .5s ease forwards}
@keyframes tnIn{from{opacity:0}to{opacity:1}}
@keyframes tnLight{0%{transform:translate(-50%,-50%) scale(.15);opacity:.5}55%{transform:translate(-50%,-50%) scale(.9);opacity:.9}100%{transform:translate(-50%,-50%) scale(7);opacity:1}}
@keyframes tnTxt{0%{opacity:0;transform:translateY(14px)}20%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:scale(1.08)}}
@keyframes tnOut{to{opacity:0;background:#fff}}
.cflash{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.cflash::before{content:'';position:absolute;inset:0;animation:cflashV 1.4s ease-out forwards}
.cflash.y::before{background:radial-gradient(ellipse at center,transparent 35%,rgba(246,198,43,.55) 100%)}
.cflash.r::before{background:radial-gradient(ellipse at center,transparent 30%,rgba(227,40,52,.65) 100%)}
.cflash::after{content:'';position:absolute;inset:0;background:#fff;animation:cflashW .35s ease-out forwards}
.cflash-card{position:absolute;left:50%;top:44%;width:min(22%,120px);aspect-ratio:5/7;border-radius:10px;box-shadow:0 30px 60px rgba(0,0,0,.6),inset 0 0 0 3px rgba(255,255,255,.3);animation:cflashC 1.3s cubic-bezier(.2,1.3,.3,1) forwards}
.cflash.y .cflash-card{background:linear-gradient(160deg,#ffe27a,#f2b51e)}.cflash.r .cflash-card{background:linear-gradient(160deg,#ff6b72,#c9252f)}
.cflash-line{position:absolute;left:-10%;right:-10%;top:44%;height:6px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);animation:cflashL .6s ease-out .05s forwards;opacity:0}
@keyframes cflashV{0%{opacity:0}15%{opacity:1}70%{opacity:.8}100%{opacity:0}}
@keyframes cflashW{0%{opacity:.55}100%{opacity:0}}
@keyframes cflashC{0%{transform:translate(-50%,-50%) scale(2.6) rotate(-28deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1) rotate(-8deg);opacity:1}80%{transform:translate(-50%,-50%) scale(1.04) rotate(-8deg);opacity:1}100%{transform:translate(-50%,-80%) scale(.9) rotate(-8deg);opacity:0}}
@keyframes cflashL{0%{opacity:0;transform:scaleX(.2)}30%{opacity:1}100%{opacity:0;transform:scaleX(1.2)}}
.tense{position:relative}
.sheet.tense::after,.prompt.tense::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 70px 10px rgba(180,20,30,.55);animation:tensePulse .82s ease-in-out infinite;z-index:3}
@keyframes tensePulse{0%,100%{opacity:.35}50%{opacity:1}}
.timer.low i{animation:tmrBlink .41s steps(2) infinite}
@keyframes tmrBlink{50%{filter:brightness(1.6)}}
.sheet.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.verdict{position:relative;margin-top:8px}
.stamp{position:absolute;right:10px;top:-14px;padding:5px 10px;border:3px solid currentColor;border-radius:8px;font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.08em;text-transform:uppercase;line-height:1;transform:rotate(-8deg);opacity:.95;animation:stampIn .45s cubic-bezier(.2,1.6,.4,1) .15s both;pointer-events:none;background:#0d1411;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.stamp.good{color:#4ee08f}.stamp.mid{color:#ffc94a}.stamp.bad{color:#ff5a62}
.rk{position:relative}
.stamp.rk-stamp{top:auto;bottom:18px;right:16px;font-size:18px;transform:rotate(-10deg)}
@keyframes stampIn{0%{opacity:0;transform:rotate(-8deg) scale(2.4)}100%{opacity:.95;transform:rotate(-8deg) scale(1)}}
.stamp.rk-stamp{animation-name:stampIn2;animation-delay:1.2s}
@keyframes stampIn2{0%{opacity:0;transform:rotate(-10deg) scale(2.4)}100%{opacity:.92;transform:rotate(-10deg) scale(1)}}
.cburst{position:fixed;inset:0;pointer-events:none;z-index:9998;overflow:hidden}
.cburst i{position:absolute;top:-4vh;left:var(--x);width:10px;height:16px;background:var(--c);border-radius:2px;transform:rotate(var(--r));animation:cbFall var(--t) cubic-bezier(.3,.6,.5,1) var(--d) forwards}
@keyframes cbFall{0%{transform:translate(0,0) rotate(var(--r))}100%{transform:translate(var(--dx),110vh) rotate(calc(var(--r) + 720deg))}}
.ticket{position:relative;overflow:hidden}
.ticket::before{content:'';position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--tc1) 0 50%,var(--tc2) 50% 100%);z-index:2}
.tk-stub{position:absolute;right:0;top:0;bottom:0;width:84px;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;background:rgba(255,248,225,.06);border-left:2px dashed rgba(255,255,255,.25);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.tk-stub b{font-size:22px;color:#fff;letter-spacing:0}
.tk-stub::before,.tk-stub::after{content:'';position:absolute;left:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg,#0b0f0d)}
.tk-stub::before{top:-11px}.tk-stub::after{bottom:-11px}
.fxc.ticket{padding-right:96px}
@media (max-width:560px){.tk-stub{width:70px;font-size:10px}.tk-stub b{font-size:18px}.fxc.ticket{padding-right:80px}}
.t-play .tk-stub{top:14px;right:14px;bottom:auto;width:92px;height:auto;padding:10px 6px;border:1.5px dashed rgba(255,255,255,.35);border-radius:12px;background:rgba(8,12,10,.82);backdrop-filter:blur(4px)}
.t-play .tk-stub::before,.t-play .tk-stub::after{display:none}
.atmo{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden;border-radius:inherit}
.atmo.rain{background:repeating-linear-gradient(105deg,transparent 0 14px,rgba(200,220,255,.16) 14px 15px,transparent 15px 31px);background-size:200px 200px;animation:atRain .5s linear infinite}
@keyframes atRain{to{background-position:-60px 200px}}
.atmo.snow{background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(2.5px 2.5px at 80px 120px,#fff,transparent),radial-gradient(1.5px 1.5px at 150px 70px,#fff,transparent),radial-gradient(2px 2px at 200px 160px,#fff,transparent),radial-gradient(1.5px 1.5px at 120px 10px,#fff,transparent);background-size:220px 200px;opacity:.85;animation:atSnow 6s linear infinite}
@keyframes atSnow{to{background-position:40px 400px,-30px 400px,20px 400px,-10px 400px,30px 400px}}
.atmo.fog::before{content:'';position:absolute;inset:-20%;background:radial-gradient(ellipse at 30% 40%,rgba(220,230,235,.22),transparent 60%),radial-gradient(ellipse at 75% 65%,rgba(220,230,235,.18),transparent 55%);animation:atFog 14s ease-in-out infinite alternate}
@keyframes atFog{to{transform:translateX(8%)}}
.atmo.derby::after{content:'';position:absolute;left:0;right:0;top:0;height:22%;background:radial-gradient(18px 26px at 12% 60%,rgba(255,120,40,.85),transparent),radial-gradient(14px 22px at 31% 55%,rgba(255,90,40,.8),transparent),radial-gradient(16px 24px at 68% 58%,rgba(255,130,50,.85),transparent),radial-gradient(14px 20px at 88% 62%,rgba(255,100,40,.8),transparent);filter:blur(1px);animation:atFlare 1.1s ease-in-out infinite alternate}
@keyframes atFlare{0%{opacity:.55;transform:translateY(1px)}100%{opacity:1;transform:translateY(-1px)}}
.atmo.big:not(.derby)::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 15% 0%,rgba(255,255,230,.14),transparent 45%),radial-gradient(ellipse at 85% 0%,rgba(255,255,230,.14),transparent 45%)}
.lk-pop{display:inline-block;animation:lkPop .7s cubic-bezier(.2,1.6,.4,1) var(--pd,0s) both}
@keyframes lkPop{0%{transform:scale(.6);opacity:.3}60%{transform:scale(1.25);color:#ff5a7a}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.cflash,.cburst,.atmo,.tunnel .tn-light{animation:none!important}.sheet.shake{animation:none}.sheet.tense::after{animation:none;opacity:.6}}

/* 1.5b: jest, telsiz, tribün */
.g-hidden{display:none!important}
.gpad{--gp:0;--gx:0px;--gy:0px;position:relative;display:grid;grid-template-columns:76px minmax(0,1fr);align-items:center;gap:14px;min-height:96px;padding:12px 16px;border-radius:16px;border:2px dashed rgba(246,198,43,.55);background:linear-gradient(135deg,rgba(246,198,43,.14),rgba(255,255,255,.03));cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;overflow:visible}
.gpad.off{border-color:var(--line2);background:rgba(255,255,255,.03);cursor:default}
.gpad.off .gp-ic{opacity:.35}
.gpad.nudge{animation:shake .4s ease}
.gp-t{display:flex;flex-direction:column;gap:3px}.gp-t b{font-size:17px}.gp-t small{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.gp-fill{position:absolute;left:0;bottom:0;height:4px;border-radius:0 0 0 14px;width:calc(var(--gp)*100%);background:var(--yellow);transition:width .05s}
.gp-ic{position:relative;width:76px;height:76px;display:grid;place-items:center}
.gp-ic>i{position:absolute;display:none}
.gpad[data-k=red] .gp-card,.gpad[data-k=yellow] .gp-card{display:block;width:40px;height:56px;border-radius:6px;box-shadow:0 8px 18px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.3);transform:translate(var(--gx),calc(14px + min(0px,var(--gy)))) rotate(-6deg);transition:transform .05s}
.gpad[data-k=yellow] .gp-card{background:linear-gradient(160deg,#ffe27a,#f2b51e)}.gpad[data-k=red] .gp-card{background:linear-gradient(160deg,#ff6b72,#c9252f)}
.gpad[data-k=red] .gp-ic::after,.gpad[data-k=yellow] .gp-ic::after{content:'';position:absolute;left:12px;right:12px;bottom:2px;height:34px;border-radius:0 0 10px 10px;background:#1c2a24;border:2px solid #2e4238;border-top:none}
.gpad[data-k=red]:not(.off) .gp-card,.gpad[data-k=yellow]:not(.off) .gp-card{animation:gpBob 1.4s ease-in-out infinite}
@keyframes gpBob{50%{margin-top:-10px}}
.gpad[data-k=pen] .gp-spot{display:block;width:16px;height:16px;border-radius:50%;background:#fff;top:50px;box-shadow:0 0 0 6px rgba(255,255,255,.15)}
.gpad[data-k=pen] .gp-ic::before{content:'↓';position:absolute;top:2px;font-size:34px;font-weight:800;color:var(--yellow);transform:translateY(min(40px,max(0px,var(--gy))));animation:gpDown 1.2s ease-in-out infinite}
@keyframes gpDown{50%{margin-top:10px}}
.gpad[data-k=play] .gp-arms{display:block;font-style:normal}
.gpad[data-k=play] .gp-ic::before{content:'→';font-size:44px;font-weight:800;color:var(--yellow);transform:translateX(min(40px,max(0px,var(--gx))));animation:gpRight 1.2s ease-in-out infinite}
@keyframes gpRight{50%{margin-left:14px}}
.gpad[data-k=hold] .gp-wh{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:rgba(246,198,43,.15);box-shadow:inset 0 0 0 3px rgba(246,198,43,.4)}
.gpad[data-k=hold] .gp-wh svg{width:34px;height:34px}
.gpad.holding .gp-wh{background:conic-gradient(var(--yellow) 0 0,transparent 0);animation:gpHold .55s linear forwards}
@keyframes gpHold{from{box-shadow:inset 0 0 0 3px rgba(246,198,43,.4),0 0 0 0 rgba(246,198,43,.5)}to{box-shadow:inset 0 0 0 32px rgba(246,198,43,.9),0 0 0 14px rgba(246,198,43,0)}}
.gpad.fired.f-red .gp-card,.gpad.fired.f-yellow .gp-card{animation:gpUp .4s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes gpUp{to{transform:translateY(-80px) rotate(-12deg) scale(1.4)}}
.gpad.fired{border-color:var(--yellow);background:rgba(246,198,43,.25)}
.gp-alt{display:block;margin:6px auto 0;font-size:13px;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer;padding:8px}

function wipeSlot(n){ delete NSAVE[slotKey(n)]; try{localStorage.removeItem(slotKey(n));}catch(e){} try{ const P=PLUG('Preferences'); if(P) P.remove({key:slotKey(n)}); }catch(e){} }
function migrateOld(){ try{ const old=localStorage.getItem(OLD_KEY)||NSAVE[OLD_KEY]; if(old && !readSlot(1)){ localStorage.setItem(slotKey(1),old); NSAVE[slotKey(1)]=old; const P=PLUG('Preferences'); if(P){ P.set({key:slotKey(1),value:old}); P.remove({key:OLD_KEY}); } localStorage.removeItem(OLD_KEY); } }catch(e){} }
function migrateSave(d){ if(!d) return d; if(!d.nationality) d.nationality='TR'; if(!d.country) d.country='TR'; if(d.leagueKey&&/^TR\d$/.test(d.leagueKey)) d.leagueKey='H'+d.leagueKey[2]; if(!d.look) d.look=defLook(); if(!d.growth) d.growth=1; return d; }

    const dur = kind==='long'||kind==='end'?0.55:(S.settings.dstil==='cift'?0.14:0.28);

      const t0=AC.currentTime+st; const o=AC.createOscillator(), g=AC.createGain(), lfo=AC.createOscillator(), lg=AC.createGain();
      const W=WTONES[(isPremium()&&S.settings.wsnd)||'klasik']||WTONES.klasik;
      o.type='sine'; o.frequency.value=W[0]; lfo.frequency.value=W[1]||1; lg.gain.value=W[2]; lfo.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(.12,t0+.02); g.gain.setValueAtTime(.12,t0+dur-.05); g.gain.linearRampToValueAtTime(0,t0+dur);
      o.connect(g); g.connect(AC.destination); o.start(t0); lfo.start(t0); o.stop(t0+dur+.02); lfo.stop(t0+dur+.02);

}

function roundRobin(ids){
  const n=ids.length, arr=ids.slice(); const rounds=[];
  for(let r=0;r<n-1;r++){ const rd=[]; for(let i=0;i<n/2;i++){ const a=arr[i], b=arr[n-1-i]; rd.push(r%2?[b,a]:[a,b]); } rounds.push(rd); arr.splice(1,0,arr.pop()); }
  return rounds.concat(rounds.map(rd=>rd.map(([a,b])=>[b,a])));
}

function poolClubs(min,max){ const out=[]; for(const k in LEAGUES){ if(LEAGUES[k].pool!=='uefa') continue; leagueTeams(k).forEach(t=>{ if(t.str>=min&&t.str<=max) out.push(t); }); } return out.filter(t=>t.country!==S.nationality); }
function pair(pool){ const h=pick(pool); let a; let g=0; do{ a=pick(pool); }while((a.id===h.id||a.country===h.country)&&g++<60); return [h,a]; }
function summerYear(){ return S.season+1; }
function assignMidweek(ph){
  const cat=S.uefaCat; const uAvg = S.stats.intl.length?avg(S.stats.intl):8.25;
  const p = .42 + S.rep/280 + (uAvg-8.2)*.4;
  if(ph!=='F' && !chance(clamp(p,.25,.85))) return null;
  if(ph==='NT'){
    const y=summerYear(); const nextWC=(y-2030)%4===0, nextEU=(y-2028)%4===0;
    let comp = cat<=1 ? (chance(.5)?'U21Q':'UNL') : (nextWC?'WCQ':nextEU?'ECQ':'UNL');
    const pool=NATIONS.filter(n=>n[2]==='UEFA'&&n[0]!==myNT()).map(n=>mkTeam(n[0],n[1],'',n[2],true));
    const strong = cat>=3 ? pool.filter(t=>t.str>=74) : pool;
    const [h,a]=pair(strong);
    const isU21 = comp==='U21Q';
    return makeFx({kind:'mid',comp,compName:COMPS[comp].name,home:h.id,away:a.id,u21:isU21,imp:clamp(2+cat*.6+(h.str+a.str-150)/20,1,5),derby:false,vr:!isU21,glt:false,lvl:isU21?2:3+Math.min(cat,2)*.5,fee:COMPS[comp].fee,stage:isU21?'U21':'Grup maçı'});
  }

    if(cat>=4 && uAvg>=8.65 && S.rep>=75 && chance(.55)) comp='UCL';
    else if(cat>=4 && uAvg>=8.5 && chance(.5)) comp='UEL';
    else if(cat>=3 && uAvg>=8.45 && chance(.45)) comp='UECL';
    if(!comp) return null;
    const pool = comp==='UCL'?poolClubs(84,99):comp==='UEL'?poolClubs(76,88):poolClubs(68,82);
    const [h,a]=pair(pool);
    mail('AFK Hakem Komitesi','Final ataması: '+COMPS[comp].name,'Tebrikler. Sezonun en kritik maçı için seçildin. Bu görev, kariyerinin dönüm noktası olabilir.','uefa');
    return makeFx({kind:'mid',comp,compName:COMPS[comp].name,home:h.id,away:a.id,imp:5,derby:false,vr:true,glt:true,lvl:6,fee:COMPS[comp].fee*2,stage:'Final',final:true});
  }
  if(ph==='Q' && cat>=4 && chance(.35)){
    const [h,a]=pair(poolClubs(80,99));
    return makeFx({kind:'mid',comp:'USC',compName:COMPS.USC.name,home:h.id,away:a.id,imp:5,derby:false,vr:true,glt:true,lvl:6,fee:COMPS.USC.fee,stage:'Tek maç',final:true});
  }
  const ko=['KOPO','R16','QF','SF'].includes(ph);
  let opts;
  if(cat===0) opts=ko?['UYL']:(ph==='Q'||ph==='PO')?['UECL','UYL']:['UYL'];
  else if(cat===1) opts=(ph==='Q'||ph==='PO')?['UECL','UEL']:['UECL'];
  else if(cat===2) opts=(ph==='Q'||ph==='PO')?['UEL','UCL']:ko?['UECL','UEL']:['UEL','UECL'];
  else if(cat===3) opts=ko?(ph==='QF'||ph==='SF'?['UEL','UECL']:['UEL','UCL']):['UCL','UEL'];
  else opts=['UCL'];
  if((ph==='QF'||ph==='SF') && uAvg<8.3) return null;
  const comp=opts[0]&&chance(.65)?opts[0]:pick(opts);
  const youth = comp==='UYL';
  const range = comp==='UCL'?(ko?[82,99]:[74,99]):comp==='UEL'?[70,86]:comp==='UECL'?[62,78]:[60,99];
  const [h,a]=pair(poolClubs(range[0],range[1]));
  const lvl = {UYL:2,UECL:3,UEL:4,UCL:5}[comp] + (ko?.5:0);

function simScore(h,a,homeAdv){ const lam=x=>Math.max(.2,1.35*Math.pow(x,1.6)); const H=team(h).str+(homeAdv?4:0), A=team(a).str; const r=H/A; return [poisson(lam(r)), poisson(lam(1/r)*.9)]; }
function poisson(l){ let L=Math.exp(-l),k=0,p=1; do{k++;p*=rand();}while(p>L); return k-1; }
function canFinishWeek(){ return S.tasks && S.tasks.matches.every(m=>m.played); }

// ---------- season end ----------
function seasonEnd(){
  const dom=S.stats.dom, intl=S.stats.intl; const dAvg=avg(dom), iAvg=avg(intl);
  const lines=[]; const prevTier=S.tier, prevCat=S.uefaCat;
  let award=false;
  if(home()){
    if(dom.length>=8 && dAvg>=8.35 && S.tier<4){ S.tier++; lines.push(['up','Klasman yükseldi: '+rankName(S.tier)]); setTimeout(()=>confettiBurst(90),600); try{ maybeStartPromoDeal(); if(!currentDeal()) milestoneOffer('terfiK'); }catch(e){} if(S.tier===1) milestone('lig3'); if(S.tier===4) milestone('super'); }
    else if(dom.length>=8 && dAvg<7.7 && S.tier>0 && !S.fifa){ S.tier--; lines.push(['down','Klasman düştü: '+rankName(S.tier)]); }
    else if(dom.length>=8 && dAvg<7.7 && S.fifa){ lines.push(['down','Ortalaman düşük: DFF listesindeki yerin tartışmaya açıldı.']); S.rep=clamp(S.rep-6,0,100); }
    else lines.push(['same','Klasmanın korundu: '+rankName(S.tier)]);
  } else lines.push(['same',LEAGUES[S.country].league+' kadrosunda sezonu tamamladın.']);
  // DFF badge
  if(!S.fifa && prevTier===4 && dom.length>=8){
    if(dAvg>=8.3 && S.age<=38 && S.english>=2){ S.fifa=true; S.uefaCat=0; lines.push(['up','DFF kokartı kazandın! AFK Kategori 3 ile Avrupa yolu açıldı.']); milestone('fifa'); }
    else if(S.english<2) lines.push(['warn','DFF kokartı için en az B2 İngilizce şart (Gelişim > Dil kursu).']);
    else if(S.age>38) lines.push(['warn','DFF listesine ilk giriş için yaş sınırı (38) aşıldı.']);
    else lines.push(['warn','DFF kokartı için sezon ortalaması 8.30+ olmalı.']);
  }
  // AFK category
  if(S.fifa && prevCat>=0 && intl.length>=3){
    if(iAvg>=8.45 && dAvg>=8.0 && S.uefaCat<4){
      if(S.uefaCat===3 && S.english<3) lines.push(['warn','Elit kategori için C1 İngilizce gerekiyor.']);
      else { S.uefaCat++; lines.push(['up','AFK kategorin yükseldi: '+UEFA_CATS[S.uefaCat]]); if(S.uefaCat===4) milestone('elit'); }
    } else if(iAvg<7.85 && S.uefaCat>0){ S.uefaCat--; lines.push(['down','AFK kategorin düştü: '+UEFA_CATS[S.uefaCat]]); }
    else lines.push(['same','AFK kategorin korundu: '+UEFA_CATS[S.uefaCat]]);
  } else if(S.fifa && prevCat>=0 && uefaActive()) lines.push(['same','AFK değerlendirmesi için yeterli uluslararası maç yok (en az 3).']);
  if(dom.length>=10 && dAvg>=8.6 && (S.tier===4||abroad())){ award=true; S.rep=clamp(S.rep+5,0,100); milestone('yilin'); lines.push(['up','Yılın Hakemi ödülü senin! İtibar +5']); }
  // contract
  if(abroad()){ S.contract--; if(S.contract<=0){ S.pendingMove={country:S.nationality,years:0}; lines.push(['same','Yurt dışı sözleşmen bitti; gelecek sezon '+tierName(4)+'\'e dönüyorsun.']); } }
  // tournaments
  const y=summerYear(); let tour=null;
  const best = S.fifa ? S.uefaCat : -1;
  const recent = intl.length ? iAvg : 0;
  if(best>=3 && S.rep>=62 && recent>=8.25 && (y-2030)%4===0) tour='WC';
  else if(best>=3 && S.rep>=58 && recent>=8.2 && (y-2028)%4===0) tour='EURO';
  else if(best>=3 && recent>=8.25 && (y-2029)%4===0) tour='CWC';
  else if(best===4 && y%2===1 && recent>=8.3) tour='NLF';
  else if(best>=1 && best<=3 && S.age<=40 && y%4===0 && recent>=8.1) tour='OLY';
  else if(best>=0 && best<=2 && y%2===1 && recent>=8.15) tour='U21E';
  if(tour){ lines.push(['up',COMPS[tour].name+' '+y+' için hakem listesine seçildin!']); if(tour==='WC'||tour==='EURO') milestone('turnuva'); }
  const rec={season:S.season,league:leagueName(),rank:rankText(),matches:dom.length+intl.length,dAvg:dom.length?dAvg:null,iAvg:intl.length?iAvg:null,award,tour:tour?COMPS[tour].name:null};
  S.seasons.push(rec); S.prevAvg=dom.length?dAvg:S.prevAvg;
  S.summary={lines,rec,tour};
  if(S.age+1>=46){ S.summary.retire=true; }
  news('kurul',`${seasonLabel(S.season)} sezonu klasman listesi açıklandı`,lines.map(l=>l[1]).join(' '));
  lines.forEach(l=>{ if(l[0]==='up'||l[0]==='down') kurulDecision(S.name+': '+l[1],l[0]==='up'?'ok':'warn'); });
  S.phase='seasonEnd';
}

  else if(comp==='WC') pool=NATIONS.filter(n=>n[0]!==myNT()).map(n=>mkTeam(n[0],n[1],'',n[2],true));
  else pool=NATIONS.filter(n=>n[2]==='UEFA'&&n[0]!==myNT()).map(n=>mkTeam(n[0],n[1],'',n[2],true));
  const late = T.idx>=T.stages.length-3; const strongPool = late? pool.filter(t=>t.str>=80): pool;

function tournamentAfter(rating){
  const T=S.tournament; T.ratings.push(rating); const a=avg(T.ratings);
  if(T.stages[T.idx]==='Final'){ T.done=true; T.result='Finali yönettin'; if(T.comp==='WC') milestone('dkfinal'); milestone('final'); S.rep=clamp(S.rep+8,0,100); return; }
  T.idx++;
  const next=T.stages[T.idx];

function cardOpts(pmap){ // pmap: {sari:player,kirmizi:player,...}
  const o=[{id:'yok',label:'Kart yok',cls:'none'}];
  for(const k in pmap){ const [cls,txt]= k.includes('kirmizi')?['r','Kırmızı']:['y','Sarı']; o.push({id:k,label:txt+' · '+pmap[k].label,cls}); }
  return o;
}

function incidentBase(type,c){ return {type,goalScorer:c.ap,title:TYPE_TITLES[type],minute:c.minute,ai:c.ai,di:c.di,A:c.A,D:c.D,law:LAWS[type],accept:[],partial:[],cards:{},onD:{},reviewable:true,factual:false,borderline:false}; }

function genIncident(type,c){
  const g = GEN[type]; const inc = g(c); return inc;
}
function ctxFor(M,ai){ const di=1-ai; const A=team(ai?M.fx.away:M.fx.home), D=team(di?M.fx.away:M.fx.home);
  const ap=pickPlayer(M,ai,['FWD','MID']), dp=pickPlayer(M,di,['DEF','MID'],[ap.no]), gk=squad(D).pl[0];
  return {M,ai,di,A,D,ap,dp,gk,minute:M.minLabel()}; }
function pickPlayer(M,side,pos,excl){ const t=team(side?M.fx.away:M.fx.home); const out=M.sentOff[side]; const list=squad(t).pl.filter(p=>p.pos!=='GK'&&(!pos||pos.includes(p.pos))&&!out.includes(p.no)&&!(excl||[]).includes(p.no)); return pick(list.length?list:squad(t).pl.slice(1,11)); }
const tag = (side,p)=>({side,p,label:pl(p)+(side==='A'?' (hücum)':' (savunma)')});

 penalti_temas(c){

function buildMatch(fx){
  const H=team(fx.home), A=team(fx.away);
  const lvl=fx.lvl;
  const m={fx,H,A,score:[0,0],min:0,addMin:0,phase:'h1',added:{1:0,2:0},reds:[0,0],yellow:[[],[]],sentOff:[[],[]],cardsLog:[],feed:[],queue:[],schedule:[],log:[],stop:{1:[],2:[]},
    temp:clamp(12+fx.imp*6+(fx.derby?18:0),0,90),tempMax:0,tempSum:0,tempN:0,stamina:0,visMod:0,lawUses:easy()?99:1+S.lawBonus+(S.attrs.kural>=70?1:0),done:false,paused:false,modal:false,auto:false,
    possession:[0,0],shots:[0,0],posGood:0,posTotal:0,mgmtAt:-99,goalsLog:[],penalties:0,varCount:0};
  m.minLabel=function(){ return this.phase==='pens'?'Pen.':(this.phase==='h1add'?'45+'+this.addMin:(this.phase==='h2add'||this.phase==='etb'||(this.phase==='ft'&&!this.et))?'90+'+this.addMin:this.min)+"'"; };
  m.stamina=clamp(55+S.attrs.kondisyon*.42+(S.energy-60)*.25,30,100);
  // incident schedule
  const nMaj=easy()?ri(3,4):clamp(4+(lvl>=3?1:0)+(fx.imp>=4?1:0)+ri(0,1),4,7), nQ=easy()?2:ri(3,4);
  const weights=[['penalti_temas',14],['elle_oynama',11],['hucum_elle_gol',5],['ofsayt_gol',13],['orta_saha_faul',20],['dogso',6],['dirsek',7],['top_disinda',4],['kaleci_engelleme',6],['gol_oncesi_faul',7],['geri_pas',lvl<=3?5:2],['yuksek_ayak',7],['korner_cekme',8],['kaleci_disari',4]];
  if(!fx.glt && lvl<=3) weights.push(['gol_cizgisi',6]);
  if(fx.role==='ar'){ weights.length=0; weights.push(['ofsayt_gol',10],['gol_cizgisi',3],['kaleci_disari',2]); }
  if(fx.role==='var'){ weights.length=0; weights.push(['penalti_temas',16],['elle_oynama',12],['hucum_elle_gol',6],['ofsayt_gol',14],['dogso',8],['top_disinda',6],['kaleci_engelleme',6],['gol_oncesi_faul',8],['yuksek_ayak',5],['korner_cekme',6],['orta_saha_faul',8]); }
  const used={}; const mins=new Set();
  const minPick=()=>{ let x; do{ x=chance(.5)?ri(4,43):ri(48,88); }while(mins.has(x)||mins.has(x-1)||mins.has(x+1)); mins.add(x); return x; };
  for(let i=0;i<nMaj;i++){ let t; let g=0; do{ t=wpick(weights); }while((used[t]||0)>=2&&g++<20); used[t]=(used[t]||0)+1; m.schedule.push({min:minPick(),kind:'inc',type:t,side:chance(H.str/(H.str+A.str))?0:1}); }
  const qs=fx.role==='var'?[]:fx.role==='ar'?shuffle(QUICK.filter(q=>q.need==='ar')).slice(0,ri(2,3)):shuffle(QUICK.filter(q=>!q.need&&(!q.needBooked||ri(0,1)))).slice(0,nQ);
  qs.forEach(q=>m.schedule.push({min:minPick(),kind:'quick',q:q.id,side:chance(.5)?0:1}));
  if(!fx.role&&fx.kind!=='acad'&&chance(.4)) m.schedule.push({min:minPick(),kind:'olay',o:pick(OLAY_IDS),side:ri(0,1)});
  m.schedule.sort((a,b)=>a.min-b.min);
  return m;
}
function feed(text,cls){ M.feed.push({m:M.minLabel(),text,cls:cls||''}); if(!M.auto) renderFeedLine(M.feed[M.feed.length-1]); }
function stopAdd(label,sec){ const h=(M.phase==='h1'||M.phase==='h1add')?1:2; M.stop[h].push({label,sec}); }
function sideTeam(i){ return i?M.A:M.H; }
function goal(side,p,note){
  M.score[side]++; const t=sideTeam(side);
  feed(`<b>GOL! ${esc(t.name)}</b>: ${esc(pl(p))}${note?' · '+note:''}. Skor ${M.score[0]}-${M.score[1]}`,'goal');
  M.goalsLog.push({side,min:M.minLabel(),p});
  if(!M.auto&&SC) sceneGoal(SC,side,p);
  stopAdd('Gol: '+t.short,ri(40,60));
  M.temp=clamp(M.temp+3,0,100);
  if(!M.auto) haptic('medium');
  if(!M.auto){ const sc=$('#mScore'); if(sc){ sc.classList.remove('flash'); void sc.offsetWidth; sc.classList.add('flash'); } }
  if(chance(.18)){ const q=QUICK.find(x=>x.id==='forma'); M.queue.push({kind:'quick',q:'forma',side,scorer:p}); }
}
function giveCard(side,p,red,coach){
  const t=sideTeam(side);
  if(coach){ feed(`<span class="mini-card ${red?'r':'y'}"></span> ${esc(squad(t).coach)} (${esc(t.short)} teknik direktör) ${red?'kırmızı':'sarı'} kart gördü.`,'dec'); M.cardsLog.push({side,label:squad(t).coach+' (TD)',red,min:M.minLabel()}); if(!M.auto) cardShow(side,null,red,false,true); return; }

// ---------- rating ----------
function computeRating(){
  let r=8.15; const w=M.fx.imp>=4?1.25:1; let errors=0, majors=0;
  for(const d of M.log){
    if(d.cat==='major'){ majors++; const t={dogru:.09,kabul:.03,kismen:-.16,hata:-.5,var:-.14,israr:-.7,durdu:.12}[d.v]; r+= t<0?t*w*(easy()?.6:1):t; if(d.v==='hata'||d.v==='israr') errors++; if(d.late) r-=.04; }
    else if(d.cat==='quick') r+= d.v==='dogru'?.03:-.13;
    else if(d.cat==='mgmt') r+= d.v==='dogru'?.06:d.v==='kismen'?-.04:-.2;
    else if(d.cat==='uz') r+= d.v==='dogru'?.03:d.v==='kabul'?.01:-.07;
  }
  if(M.tempMax>88) r-=.15; else if(M.tempMax>75) r-=.05;
  const avgT=M.tempN?M.tempSum/M.tempN:50; if(avgT<40) r+=.04;
  if(errors===0 && M.fx.lvl>=4) r+=.1;
  if(errors===0 && M.fx.imp>=4) r+=.05;
  r+=rf(-.04,.04);
  return Math.round(clamp(r,5.8,9.7)*10)/10;
}

    const main=inc.facts.filter(f=>f.key && f.val!=='—'), rest=inc.facts.filter(f=>!main.includes(f) && f.val!=='—');
    const one=f=>factOne(f,false,true);
    return (main.length?main:rest.slice(0,3)).map(one).join('')+(main.length&&rest.length?`<details class="more-facts"><summary>Diğer ayrıntılar (${rest.length})</summary>${rest.map(one).join('')}</details>`:'');
  }
  return inc.facts.map(f=>factOne(f,all)).join('');
}
function factOne(f,all,mark){ const k=mark&&f.key?' key':'';
  {
    if(all) return `<div class="fact"><span class="k">${esc(f.label)}</span><span class="v">${esc(f.val)}</span></div>`;
    if(f.obs) return `<div class="fact obs"><span class="k">${esc(f.label)}</span><span class="v">Net göremedin · ${esc(f.hint)}?</span></div>`;
    if(f.rev) return `<div class="fact rev"><span class="k">${esc(f.label)}</span><span class="v">${esc(f.val2||f.val)} <span class="chip b">ekip</span></span></div>`;
    if(k) return `<div class="fact key"><span class="k">${esc(f.label)}<small class="kx">belirleyici</small></span><span class="v">${esc(f.val)}</span></div>`;
    return `<div class="fact"><span class="k">${esc(f.label)}</span><span class="v">${esc(f.val)}</span></div>`;
  }
}

function observerText(r,e,n){
