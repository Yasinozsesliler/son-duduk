<title>Son Düdük</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&family=Saira+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: floodlit night-match app shell. Sticky scoreboard bar, side nav (bottom tabs on phones), one main column.
   Matches open as a full-screen broadcast overlay; incidents open as a referee's review sheet over it. */
:root{
  --bg:#0c121b; --bg2:#101824; --panel:#152030; --panel2:#1b293c; --line:#263851; --line2:#33496a;
  --fg:#e8eef4; --muted:#8b9bb0; --dim:#5f7088;
  --yellow:#f6c62b; --yellow-ink:#231a00; --red:#e3434b; --green:#38b27a; --blue:#5b9bff; --amber:#f29b38;
  --pitch:#1b5a3d; --pitch2:#1f6444; --chalk:#e9f1ea;
  --f-display:'Saira Condensed','Arial Narrow',sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg2)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:disabled{cursor:not-allowed;opacity:.45}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;width:100%}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance;line-height:1.1}
h2{font-size:24px;text-transform:uppercase}
h3{font-size:18px;text-transform:uppercase;letter-spacing:.05em}
p{margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2);font-weight:600;transition:background .15s,border-color .15s,transform .1s}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow);font-family:var(--f-display);font-size:17px;letter-spacing:.06em;text-transform:uppercase;font-weight:800}
.btn.primary:hover:not(:disabled){filter:brightness(1.07)}
.btn.danger{border-color:var(--red);color:#ffd6d8}
.btn.sm{padding:6px 10px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.chip.y{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow)}
.chip.g{color:var(--green);border-color:color-mix(in srgb,var(--green) 50%,transparent)}
.chip.r{color:#ff9aa0;border-color:color-mix(in srgb,var(--red) 55%,transparent)}
.chip.b{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 50%,transparent)}
.chip.a{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 50%,transparent)}
.kit{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(255,255,255,.25);flex:none}
.mini-card{display:inline-block;width:9px;height:12px;border-radius:2px;vertical-align:-1px}
.mini-card.y{background:var(--yellow)} .mini-card.r{background:var(--red)}

/* ---------- top bar & shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg2);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:16px;min-height:58px;flex-wrap:wrap;padding-block:6px}
.brand{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand svg{width:26px;height:26px}
.top-stats{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap;align-items:center}
.ts{display:flex;flex-direction:column;line-height:1.1}
.ts b{font-family:var(--f-mono);font-size:14px;font-weight:600}
.ts span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:196px minmax(0,1fr);gap:24px;padding-block:20px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.side{display:flex;flex-direction:column;gap:2px;position:sticky;top:80px;align-self:start}
nav.side button{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;padding:10px 12px;border-radius:8px;color:var(--muted);font-weight:600}
nav.side button:hover{background:var(--panel)}
nav.side button.on{background:var(--panel2);color:var(--fg);box-shadow:inset 3px 0 0 var(--yellow)}
nav.side .badge{background:var(--yellow);color:var(--yellow-ink);border-radius:999px;font-size:11px;padding:0 7px;font-weight:700}
main{min-width:0;display:flex;flex-direction:column;gap:20px}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.side{position:fixed;left:0;right:0;bottom:0;top:auto;flex-direction:row;overflow-x:auto;background:var(--bg2);border-top:1px solid var(--line);z-index:45;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav.side button{flex:none;font-size:13px;padding:8px 10px}
  nav.side button.on{box-shadow:inset 0 -3px 0 var(--yellow)}
  .top-stats{gap:12px}
}

/* ---------- hub ---------- */
.hub{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px}
@media (max-width:1020px){.hub{grid-template-columns:minmax(0,1fr)}}
.weekhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.fx{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.fx.big{border-color:color-mix(in srgb,var(--yellow) 45%,var(--line))}
.fx .teams{font-family:var(--f-display);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fx .vs{color:var(--dim);font-size:15px}
.fx .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.fx .act{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.fx{grid-template-columns:1fr}.fx .act{justify-content:flex-start}}
.rate-pill{font-family:var(--f-mono);font-weight:600;font-size:20px;padding:4px 10px;border-radius:8px;background:var(--bg2);border:1px solid var(--line2)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.act-b{text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;gap:2px}
.act-b b{font-size:14px}
.act-b span{font-size:12px;color:var(--muted)}
.act-b:hover:not(:disabled){border-color:var(--line2)}
.act-b.on{border-color:var(--yellow);background:color-mix(in srgb,var(--yellow) 10%,var(--bg2))}
.bar{height:6px;border-radius:99px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.attr{display:grid;grid-template-columns:110px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}
.attr .num{text-align:right}
.spark{width:100%;height:46px;display:block}
.news{display:flex;flex-direction:column;gap:0}
.news button{text-align:left;padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.news button:last-child{border-bottom:0}
.news b{font-size:14px}
.next-step{border-left:3px solid var(--yellow);padding:4px 0 4px 12px}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.me td{background:color-mix(in srgb,var(--yellow) 8%,transparent)}

/* ---------- career ladder ---------- */
.ladder{display:flex;flex-direction:column;gap:0}
.rung{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 0;position:relative}
.rung .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);background:var(--bg);margin:3px 0 0 6px;position:relative;z-index:1}
.rung::before{content:"";position:absolute;left:13px;top:0;bottom:0;width:2px;background:var(--line)}
.rung:first-child::before{top:14px}.rung:last-child::before{bottom:calc(100% - 14px)}
.rung.done .dot{background:var(--green);border-color:var(--green)}
.rung.cur .dot{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 0 4px color-mix(in srgb,var(--yellow) 25%,transparent)}
.rung b{font-family:var(--f-display);font-size:17px;text-transform:uppercase;letter-spacing:.03em}
.rung .req{font-size:12px;color:var(--muted)}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.trophy{padding:10px 12px;border-radius:10px;border:1px dashed var(--line2);color:var(--dim);font-size:13px}
.trophy.on{border-style:solid;border-color:color-mix(in srgb,var(--yellow) 60%,transparent);color:var(--fg);background:color-mix(in srgb,var(--yellow) 7%,transparent)}
.trophy b{display:block;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.04em;font-size:15px}

/* ---------- start screen ---------- */
.start{min-height:100%;display:grid;place-items:start center;padding-block:40px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:
  radial-gradient(1200px 500px at 50% -10%, color-mix(in srgb,var(--pitch2) 55%,transparent), transparent 70%), var(--bg)}
.start-in{width:min(1040px,100%);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px}
@media (max-width:860px){.start-in{grid-template-columns:minmax(0,1fr)}}
.logo{font-family:var(--f-display);font-weight:800;font-size:clamp(54px,9vw,96px);line-height:.88;text-transform:uppercase;letter-spacing:.01em}
.logo span{color:var(--yellow)}
.lede{font-size:17px;color:var(--muted);max-width:52ch;margin-top:14px}
.opt-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;text-align:left;background:var(--bg2);display:flex;flex-direction:column;gap:2px}
.opt.on{border-color:var(--yellow);background:color-mix(in srgb,var(--yellow) 9%,var(--bg2))}
.opt b{font-size:14px}.opt span{font-size:12px;color:var(--muted)}
label.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;display:block;margin-bottom:6px}
.path{display:flex;flex-direction:column;gap:6px;margin-top:22px}
.path div{display:flex;gap:10px;align-items:baseline;font-size:14px}
.path i{font-style:normal;font-family:var(--f-mono);color:var(--yellow);font-size:12px;min-width:22px}

/* ---------- match overlay ---------- */
.ov{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov-in{max-width:1180px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.board{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:14px;padding:14px 18px;border-radius:14px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line2)}
.board .tm{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:clamp(17px,2.6vw,28px);text-transform:uppercase;min-width:0}
.board .tm.r{justify-content:flex-end;text-align:right}
.board .tm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .kitb{width:16px;height:30px;border-radius:4px;flex:none;border:1px solid rgba(255,255,255,.3)}
.score{display:flex;flex-direction:column;align-items:center;gap:2px}
.score .sc{font-family:var(--f-mono);font-weight:600;font-size:clamp(28px,4vw,40px);letter-spacing:.04em}
.score .clk{font-family:var(--f-mono);font-size:13px;background:var(--yellow);color:var(--yellow-ink);padding:1px 8px;border-radius:4px;font-weight:600}
.score.flash .sc{animation:flash 1s ease}
@keyframes flash{0%,100%{color:var(--fg)}30%{color:var(--yellow)}}
.mbody{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
@media (max-width:900px){.mbody{grid-template-columns:minmax(0,1fr)}}
.feed{display:flex;flex-direction:column;gap:0;max-height:min(62vh,640px);overflow:auto;padding:4px 14px}
.feed .ln{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;animation:in .3s ease}
.feed .ln .m{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.feed .ln.goal{background:color-mix(in srgb,var(--green) 10%,transparent)}
.feed .ln.goal b{color:var(--green)}
.feed .ln.dec{background:color-mix(in srgb,var(--yellow) 7%,transparent)}
.feed .ln.sys{color:var(--muted);font-style:italic}
@keyframes in{from{opacity:.2;transform:translateY(-4px)}to{opacity:1;transform:none}}
.gauge{display:flex;flex-direction:column;gap:6px}
.gauge .bar{height:10px}
.temp i{background:linear-gradient(90deg,var(--green),var(--amber),var(--red))}
.ctl{display:flex;gap:6px;flex-wrap:wrap}
.ctl .btn.on{border-color:var(--yellow);color:var(--yellow)}

/* ---------- modal / incident sheet ---------- */
.modal{position:fixed;inset:0;z-index:90;background:rgba(4,8,14,.78);backdrop-filter:blur(3px);overflow:auto;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.sheet{max-width:980px;margin:0 auto;background:var(--panel);border:1px solid var(--line2);border-radius:16px;overflow:hidden;animation:rise .25s ease}
.sheet.narrow{max-width:560px}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.sh-head{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 16px;background:var(--panel2);border-bottom:1px solid var(--line2);flex-wrap:wrap}
.sh-head h2{font-size:22px}
.sh-body{padding:16px;display:flex;flex-direction:column;gap:14px}
.timer{height:5px;background:var(--bg2)}
.timer i{display:block;height:100%;background:var(--yellow);width:100%;transition:width .1s linear}
.timer.low i{background:var(--red)}
.inc{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px}
@media (max-width:780px){.inc{grid-template-columns:minmax(0,1fr)}}
.story{font-size:16px;line-height:1.55}
.story b{color:var(--yellow)}
.pitchbox{border-radius:10px;overflow:hidden;border:1px solid var(--line2);background:var(--pitch)}
svg.pitch{display:block;width:100%;height:auto}
.facts{display:flex;flex-direction:column;gap:6px}
.fact{display:grid;grid-template-columns:132px minmax(0,1fr);gap:10px;padding:7px 10px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);font-size:14px}
.fact .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.fact.obs{border-style:dashed;border-color:var(--amber)}
.fact.obs .v{color:var(--amber)}
.fact.rev{border-color:var(--blue)}
@media (max-width:480px){.fact{grid-template-columns:92px minmax(0,1fr);gap:8px;padding:6px 8px;font-size:13px}.fact .k{font-size:10px;letter-spacing:.04em}.story{font-size:15px}.facts{gap:4px}}
.decide{display:flex;flex-direction:column;gap:10px}
.dopts{display:flex;flex-wrap:wrap;gap:8px}
.dopt{padding:10px 14px;border-radius:9px;border:1px solid var(--line2);background:var(--bg2);font-weight:600;text-align:left}
.dopt:hover{border-color:var(--muted)}
.dopt.on{border-color:var(--yellow);background:color-mix(in srgb,var(--yellow) 14%,var(--bg2));color:var(--fg)}
.cards{display:flex;gap:10px;flex-wrap:wrap}
.cbtn{width:84px;min-height:100px;border-radius:9px;padding:8px;display:flex;flex-direction:column;justify-content:flex-end;font-size:12px;font-weight:700;text-align:left;border:2px solid transparent;transition:transform .12s}
.cbtn.none{background:var(--bg2);border:2px dashed var(--line2);color:var(--muted)}
.cbtn.y{background:var(--yellow);color:var(--yellow-ink)}
.cbtn.r{background:var(--red);color:#fff}
.cbtn:hover{transform:translateY(-2px) rotate(-1.5deg)}
.cbtn.on{outline:3px solid var(--fg);outline-offset:2px;transform:translateY(-4px) rotate(-3deg)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.lawbox{font-size:13px;line-height:1.5;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--blue) 9%,var(--bg2));border:1px solid color-mix(in srgb,var(--blue) 40%,transparent)}
.verdict{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2)}
.verdict .vi{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.v-dogru .vi,.v-durdu .vi{color:var(--green)} .v-kabul .vi{color:var(--blue)} .v-kismen .vi,.v-var .vi{color:var(--amber)} .v-hata .vi,.v-israr .vi{color:var(--red)}
.monitor{border:8px solid #05080c;border-radius:14px;box-shadow:0 0 0 1px var(--line2);position:relative}
.monitor::after{content:"VAR · OFR";position:absolute;top:8px;left:10px;font-family:var(--f-mono);font-size:11px;background:#05080c;color:var(--yellow);padding:2px 6px;border-radius:3px}
.varpulse{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.06em;padding:30px 0;justify-content:center}
.varpulse i{width:14px;height:14px;border-radius:50%;background:var(--blue);animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--blue) 70%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
.posopts{display:flex;flex-direction:column;gap:8px}
.posopt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2)}
.posopt .L{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:var(--bg);font-weight:800;font-family:var(--f-display)}
.posopt:hover{border-color:var(--yellow)}
.numgrid{display:flex;gap:8px;flex-wrap:wrap}
.numgrid .btn{min-width:56px;font-family:var(--f-mono);font-size:18px}
.stoplist{display:flex;flex-direction:column;gap:4px;font-size:14px}
.stoplist div{display:flex;justify-content:space-between;gap:10px;padding:5px 10px;background:var(--bg2);border-radius:6px}

/* ---------- report ---------- */
.rep-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:640px){.rep-top{grid-template-columns:1fr}}
.bignote{font-family:var(--f-mono);font-weight:600;font-size:76px;line-height:1;letter-spacing:-.02em}
.bignote small{display:block;font-family:var(--f-display);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:6px}
.declist{display:flex;flex-direction:column;gap:8px}
.dec{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;padding:10px 12px;background:var(--bg2);border-radius:10px;border:1px solid var(--line);align-items:start}
.dec .m{font-family:var(--f-mono);color:var(--muted);font-size:13px;padding-top:2px}
.dec details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:4px}
.dec details p{font-size:13px;margin-top:6px;line-height:1.5}
.headline{font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;line-height:1.15;padding:10px 0;border-bottom:1px solid var(--line)}
.headline small{display:block;font-family:var(--f-body);text-transform:none;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.04em;margin-bottom:2px}
.social{display:flex;flex-direction:column;gap:8px}
.post{padding:10px 12px;border-radius:10px;background:var(--bg2);font-size:14px}
.post b{font-size:13px;color:var(--blue)}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(520px,calc(100% - 32px))}
#toast div{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:rise .25s ease;text-align:center}

/* pitch svg */
.pitch .grass{fill:var(--pitch)} .pitch .stripe{fill:var(--pitch2)}
.pitch .ln{fill:none;stroke:var(--chalk);stroke-width:.22;opacity:.9}
.pitch .net{fill:rgba(255,255,255,.12);stroke:var(--chalk);stroke-width:.2}
.pitch .off{stroke:var(--yellow);stroke-width:.25;stroke-dasharray:1 .7}
.pitch .arr{fill:none;stroke-width:.3;marker-end:url(#ah)}
.pitch .arr.run{stroke:rgba(255,255,255,.75);stroke-dasharray:.8 .6}
.pitch .arr.pass{stroke:var(--yellow)}
.pitch .arr.shot{stroke:#fff}
.pitch .ptxt{font-family:var(--f-mono);font-size:1.25px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.pitch .mark{fill:none;stroke:var(--yellow);stroke-width:.25;animation:ring 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.6);opacity:0}}
.pitch .vline{stroke-width:.25;stroke-dasharray:.6 .5}
.pitch .vgood{stroke:#7dffb8} .pitch .vbad{stroke:var(--amber)}
.pitch .spot{fill:var(--fg);stroke:var(--bg);stroke-width:.25}
.pitch .spottxt{font-family:var(--f-display);font-weight:800;font-size:1.8px;fill:var(--bg);text-anchor:middle;dominant-baseline:central}
.pitch .ball{fill:#fff;stroke:#111;stroke-width:.12}
.pitch .lbl{font-family:var(--f-body);font-size:1.5px;fill:var(--chalk);opacity:.8}
[hidden]{display:none!important}
/* ===== v2: header ===== */
.top-in{gap:14px;min-height:66px;flex-wrap:nowrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase;padding:0;white-space:nowrap}
.brand svg{width:32px;height:32px}
.hdr-season{display:flex;flex-direction:column;line-height:1.1;padding-left:14px;border-left:1px solid var(--line);white-space:nowrap}
.hdr-season b{font-family:var(--f-display);font-size:17px;letter-spacing:.03em;text-transform:uppercase}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:6px;min-width:0}
.hstat{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.hstat span{display:flex;flex-direction:column;line-height:1.05}
.hstat b{font-size:15px;font-weight:600;white-space:nowrap}
.hstat small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.ring{width:28px;height:28px;transform:rotate(-90deg);flex:none}
.ring circle{fill:none;stroke-width:4}
.ring-bg{stroke:var(--line2)} .ring-fg{stroke:var(--yellow);stroke-linecap:round}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hs-ic{width:22px;height:22px;color:var(--blue)} .hs-ic.gold{color:var(--yellow)}
.hdr-right>.me{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px 0 5px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);text-align:left;margin-left:4px;min-width:0}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--yellow),#e3a019);color:var(--yellow-ink);font-family:var(--f-display);font-weight:800;font-size:15px;flex:none;letter-spacing:.02em}
.av.lg{width:54px;height:54px;font-size:21px} .av.xl{width:80px;height:80px;font-size:30px;border:4px solid var(--panel)}
.me-t{display:flex;flex-direction:column;line-height:1.15;max-width:190px;min-width:0}
.me-t b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-t small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--yellow);color:var(--yellow-ink);border-radius:999px;font-size:11px;padding:0 7px;font-weight:700;line-height:18px}
@media (max-width:1100px){.hdr-season{display:none}}
@media (max-width:860px){.me-t{display:none}.hdr-right>.me{padding:0 4px;height:44px}.top-in{min-height:60px;gap:8px}.brand span{display:none}.hstat{padding:0 10px;height:42px;gap:7px}.hdr-right{gap:6px}}
@media (max-width:440px){.hide-xs{display:none}.hstat small{display:none}.hstat{height:40px;padding:0 9px}.ring{width:24px;height:24px}.hstat b{font-size:14px}}

/* ===== v2: navigation ===== */
nav.side button{justify-content:flex-start;gap:12px}
nav.side button .badge{margin-left:auto}
nav.side button .ic{opacity:.85}
nav.side button.on .ic{color:var(--yellow);opacity:1}
.bnav{display:none}
@media (max-width:860px){
  nav.side{display:none!important}
  .bnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:45;background:color-mix(in srgb,var(--bg2) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;color:var(--muted);font-size:11px;font-weight:600;position:relative;min-height:52px}
  .bnav button .ic{width:23px;height:23px}
  .bnav button.on{color:var(--yellow)}
  .bnav .dot{position:absolute;top:6px;left:calc(50% + 7px);width:8px;height:8px;border-radius:50%;background:var(--red)}
}
.menu-sheet{margin-top:auto}
.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:14px}
.menu-grid button{display:flex;align-items:center;gap:10px;padding:14px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-weight:600;text-align:left;min-height:54px}
.menu-grid .badge{margin-left:auto}

/* ===== v2: hub, cards ===== */
.hero{display:flex;flex-direction:column;gap:14px}
.hero-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hero-h h2{font-size:28px}
.fxc{border-radius:18px;border:1px solid var(--line2);background:radial-gradient(120% 150% at 50% -10%,color-mix(in srgb,var(--pitch2) 45%,var(--panel)) 0%,var(--panel) 62%);padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px}
.fxc.big{border-color:color-mix(in srgb,var(--yellow) 55%,var(--line2));box-shadow:0 18px 44px -24px rgba(246,198,43,.45)}
.fxc.done{background:var(--panel)}
.fxc-top,.fxc-bot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.fxc-mid{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}
.fxc-t{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.fxc-t b{font-family:var(--f-display);font-size:19px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;overflow-wrap:anywhere}
.fxc-c{display:flex;flex-direction:column;align-items:center;gap:6px}
.fxc-vs{font-family:var(--f-display);font-weight:800;font-size:28px;color:var(--dim)}
.fxc-sc{font-size:30px;font-weight:600}
.stars{color:var(--yellow);font-size:12px;letter-spacing:1px}.stars span{color:var(--line2)}
.crest{display:block;flex:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
.btn.wide{min-width:220px}
.alert{display:flex;gap:12px;align-items:center;text-align:left;padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--yellow) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--yellow) 50%,transparent)}
.alert .ic{color:var(--yellow);width:26px;height:26px}
.alert span{display:flex;flex-direction:column}.alert small{color:var(--muted)}
.empty{padding:22px;border:1px dashed var(--line2);border-radius:14px;color:var(--muted);text-align:center}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpis>div{display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);min-width:0}
.kpis b{font-size:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kpis small{font-size:11px;color:var(--muted)}
@media (max-width:420px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.page-h h2{font-size:30px}
.chips-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.fchip{padding:7px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.fchip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.news-lead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;padding:22px;border-radius:18px;background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--line2)}
.lead-t{font-size:clamp(24px,3.4vw,34px);margin:10px 0 8px;text-transform:none;letter-spacing:0}
@media (max-width:600px){.news-lead{grid-template-columns:minmax(0,1fr);padding:18px}}
.news-list{display:flex;flex-direction:column}
.news-list.panel{padding:4px 16px}
.news-it{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.news-it:last-child{border-bottom:0}
.news-it.cmp{padding:10px 0;gap:10px}
.news-crests{display:flex;gap:2px;min-width:36px}
.news-ph{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--bg2);color:var(--muted)}
.news-t{font-size:17px;text-transform:none;letter-spacing:0;margin:6px 0 2px;line-height:1.25}
.news-it.cmp .news-t{font-size:15px}
.feedlist{display:flex;flex-direction:column}
.post{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.post:last-child{border-bottom:0}
.post p{font-size:14.5px;margin-top:2px;overflow-wrap:anywhere}
.post .tag{color:var(--blue)}
.post.mine{background:linear-gradient(90deg,color-mix(in srgb,var(--yellow) 7%,transparent),transparent)}
.pav{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px}
.verif{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--blue);color:#fff;font-size:10px;font-weight:800;vertical-align:2px}
.post-m{font-size:12.5px;gap:18px;margin-top:6px}
.rpost{padding:10px 12px;border-radius:10px;background:var(--bg2);font-size:14px}
.rpost b{font-size:13px;color:var(--blue)}
.sprof{padding:0;overflow:hidden}
.sprof-bg{height:90px;background:radial-gradient(420px 130px at 25% 0%,var(--pitch2),transparent),linear-gradient(90deg,var(--panel2),var(--bg2))}
.sprof-in{display:flex;gap:14px;align-items:flex-end;padding:0 16px;margin-top:-36px}
.sprof-in h2{font-size:24px;letter-spacing:0}
.sprof .kpis{padding:14px 16px 16px}
.compose{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:480px){.compose{grid-template-columns:minmax(0,1fr)}}
.trend{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:center}
.trend div{display:flex;flex-direction:column}
.hearing{border-color:color-mix(in srgb,var(--yellow) 55%,var(--line2));background:color-mix(in srgb,var(--yellow) 6%,var(--panel))}
.kv{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.appts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px}
.appt{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);font-size:13px;min-width:0}
.appt.me{border-color:var(--yellow);background:color-mix(in srgb,var(--yellow) 9%,var(--bg2))}
.kdec{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.kdec:last-child{border-bottom:0}
.kdec.warn span:last-child{color:#ffb0b3}.kdec.ok span:last-child{color:#9fe3c2}
.dot-y{width:8px;height:8px;border-radius:50%;background:var(--yellow);flex:none}
.profile h3{margin:0}

/* ===== v2: match broadcast ===== */
.ov-in.match{gap:12px;padding-top:10px}
.mtop{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.mtop h2{font-size:26px}
.stage{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line2);background:#05080d;aspect-ratio:16/9;width:100%;max-height:64vh}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
@media (max-width:700px){.stage{aspect-ratio:4/3.2;border-radius:12px}}
.bug{position:absolute;top:12px;left:12px;display:flex;align-items:stretch;border-radius:8px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.5);font-family:var(--f-display);font-weight:800;font-size:16px;text-transform:uppercase}
.bug-tm{display:flex;align-items:center;gap:7px;padding:5px 10px;background:rgba(10,15,23,.94);color:#fff;letter-spacing:.04em}
.bug-tm i{width:5px;height:18px;border-radius:2px;display:block}
.bug b{display:flex;align-items:center;padding:5px 10px;background:#f2f4f7;color:#0c121b;font-family:var(--f-mono);font-size:15px;white-space:nowrap}
.bug-clk{display:flex;align-items:center;padding:5px 9px;background:var(--yellow);color:var(--yellow-ink);font-size:14px}
.bug-r{position:absolute;top:14px;right:12px;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:6px;background:rgba(10,15,23,.78);color:#cdd6e1}
@media (max-width:560px){.bug{top:8px;left:8px;font-size:13px}.bug b{font-size:13px}.bug-clk{font-size:12px}.bug-r{display:none}}
.banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 30px;border-radius:12px;background:rgba(10,15,23,.9);border:1px solid var(--line2);animation:bnr .4s cubic-bezier(.2,1.4,.4,1);pointer-events:none;text-align:center;max-width:90%}
.banner b{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,58px);letter-spacing:.06em;line-height:1;text-transform:uppercase}
.banner span{font-size:14px;color:var(--muted)}
.banner.goal{background:linear-gradient(135deg,rgba(56,178,122,.96),rgba(15,90,58,.96));border-color:transparent}.banner.goal b{color:#fff}.banner.goal span{color:#d9f5e7}
.banner.yellow{background:var(--yellow);border-color:transparent}.banner.yellow b,.banner.yellow span{color:var(--yellow-ink)}
.banner.red{background:var(--red);border-color:transparent}.banner.red b,.banner.red span{color:#fff}
.banner.var b{color:var(--blue)}
.banner.whistle b,.banner.board b{font-size:clamp(22px,4vw,36px)}
.banner.board b{color:var(--yellow);font-family:var(--f-mono)}
@keyframes bnr{from{transform:translate(-50%,-50%) scale(.7);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.prompt{position:relative;padding:12px 14px;border-radius:14px;background:rgba(10,15,23,.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line2);display:flex;flex-direction:column;gap:8px;animation:rise .25s ease;z-index:3;border-color:color-mix(in srgb,var(--yellow) 45%,var(--line2))}
.pr-head{display:flex;justify-content:space-between;align-items:center}
.pr-tag{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--yellow)}
.pr-tag.ok{color:var(--green)}.pr-tag.bad{color:#ff8a8f}
.pr-q{font-size:15px}
.pr-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pr-opts.row{display:flex;flex-wrap:wrap}
.prompt .posopt{font-size:13px;padding:8px 10px}
.prompt .timer{border-radius:99px;overflow:hidden}
@media (max-width:700px){.pr-opts{grid-template-columns:minmax(0,1fr)}.prompt{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:75;max-height:46vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.6)}}
@media (max-width:560px){.mbar{gap:8px}.mbar .meter{min-width:calc(50% - 8px)}.mbar .seg button{padding:7px 9px}.mbar .btn.sm{padding:6px 10px;min-height:36px}}
.mbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.meter{display:flex;flex-direction:column;gap:5px;min-width:110px;flex:1}
.meter .bar{height:8px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--bg2)}
.seg button{padding:8px 12px;font-size:13px;font-weight:600;color:var(--muted);border-right:1px solid var(--line2);min-height:36px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--panel2);color:var(--yellow)}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}
@media (max-width:900px){.mgrid{grid-template-columns:minmax(0,1fr)}.mgrid aside{order:-1}}
.feedp{padding:0}
.feedp .feed{max-height:360px}
.stat2{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;font-size:15px}
.stat2>span:last-child{text-align:right}
.stat2 .mini-card{margin:0 3px 0 2px}
.possbar{display:flex;height:6px;border-radius:99px;overflow:hidden;gap:2px}
.possbar i{display:block;height:100%}
.pm-vs{position:absolute;inset:auto 0 0 0;display:flex;justify-content:center;align-items:center;gap:22px;padding:22px 18px 18px;background:linear-gradient(0deg,rgba(5,8,13,.94),transparent)}
.pm-t{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:clamp(16px,2.6vw,26px);text-transform:uppercase}
.pm-x{font-family:var(--f-display);font-weight:800;color:var(--yellow);font-size:22px}
@media (max-width:560px){.pm-vs{flex-direction:column;gap:4px;padding:12px}.pm-t .crest{width:30px;height:30px}}

/* ===== v2: replay ===== */
.replay{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line2);background:#05080d;aspect-ratio:16/10;width:100%}
.replay canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.rp-top{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* ===== v4: premium layer ===== */
:root{--bg:#070b12;--bg2:#0b111b;--panel:#0e1623;--panel2:#152033;--line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.13);--gold1:#ffdb5c;--gold2:#ec9f17;--glass:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.012));--lift:inset 0 1px 0 rgba(255,255,255,.06),0 24px 60px -30px rgba(0,0,0,.85)}
body{background:radial-gradient(1100px 620px at 88% -12%,rgba(246,198,43,.075),transparent 62%),radial-gradient(1000px 760px at -12% 8%,rgba(32,101,69,.2),transparent 62%),radial-gradient(900px 600px at 50% 120%,rgba(53,101,196,.1),transparent 60%),var(--bg)}
.panel{background:var(--glass),var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--lift)}
h3{font-size:17px;letter-spacing:.08em}
.page-title{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:.01em}
.page-title .muted{font-size:.55em;font-weight:600;letter-spacing:.06em;margin-left:6px}
.eyebrow.gold{color:var(--gold1);display:inline-flex;align-items:center;gap:8px}
.eyebrow.gold::before{content:"";width:16px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--gold1),var(--gold2))}
.btn{background:var(--glass),var(--panel2);border:1px solid var(--line2);border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.btn:hover:not(:disabled){border-color:rgba(255,255,255,.28);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02)),var(--panel2)}
.btn.primary{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--gold1),var(--gold2));border:0;color:#211600;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 30px -10px rgba(240,165,25,.65);text-shadow:0 1px 0 rgba(255,255,255,.35)}
.btn.primary::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);transition:left .6s ease}
.btn.primary:hover:not(:disabled)::after{left:130%}
.btn.primary:disabled{background:var(--panel2);color:var(--dim);box-shadow:none;text-shadow:none;opacity:1;border:1px solid var(--line)}
.btn.lg{padding:15px 30px;font-size:20px;border-radius:14px}
.top{background:rgba(7,11,18,.7);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
body::before{background:rgba(7,11,18,.92)}
.hstat{background:var(--glass),rgba(14,22,35,.7);border-color:var(--line);border-radius:14px}
.hdr-right>.me{background:var(--glass),rgba(21,32,51,.8);border-color:var(--line2)}
.av{background:linear-gradient(135deg,var(--gold1),var(--gold2));box-shadow:0 0 0 2px rgba(7,11,18,.9),0 0 0 3px rgba(255,219,92,.45)}
nav.side button{border-radius:12px;transition:background .15s,color .15s}
nav.side button:hover{background:rgba(255,255,255,.04)}
nav.side button.on{background:linear-gradient(90deg,rgba(255,219,92,.16),rgba(255,219,92,0));box-shadow:inset 2px 0 0 var(--gold1);color:var(--fg)}
.chip{border-color:var(--line2);background:rgba(255,255,255,.03)}
.chip.y{background:linear-gradient(180deg,var(--gold1),var(--gold2));color:#211600;border:0}
main>*{animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both}
main>*:nth-child(2){animation-delay:.05s}main>*:nth-child(3){animation-delay:.1s}
@keyframes fadeUp{from{opacity:.25;transform:translateY(8px)}to{opacity:1;transform:none}}
/* match hero */
.mhero{position:relative;border-radius:26px;overflow:hidden;border:1px solid var(--line2);box-shadow:0 40px 90px -40px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.08);isolation:isolate;background:#05080d}
.mhero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-2;display:block}
.mhero-shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(7,11,18,.55) 0%,rgba(7,11,18,.05) 30%,rgba(7,11,18,.25) 55%,rgba(7,11,18,.93) 86%,rgba(7,11,18,.98) 100%)}
.mhero-in{display:flex;flex-direction:column;justify-content:space-between;gap:18px;padding:18px 22px 22px;min-height:min(420px,70vh)}
.mhero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mhero-comp{font-family:var(--f-display);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:13px;color:#d5dde8;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.mhero-teams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}
.mh-t{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-width:0}
.mh-t .crest{width:clamp(58px,9vw,88px);height:auto;filter:drop-shadow(0 10px 22px rgba(0,0,0,.7))}
.mh-t b{font-family:var(--f-display);font-weight:800;font-size:clamp(19px,3vw,32px);text-transform:uppercase;line-height:1;letter-spacing:.01em;text-shadow:0 3px 16px rgba(0,0,0,.9);overflow-wrap:anywhere}
.mh-t small{color:#b9c4d2;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.mh-vs{display:flex;flex-direction:column;align-items:center;gap:4px}
.mh-vs span{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,4.5vw,46px);line-height:1;background:linear-gradient(180deg,#fff,#8e9bae);-webkit-background-clip:text;background-clip:text;color:transparent}
.mh-vs small{font-family:var(--f-mono);font-size:12px;color:var(--gold1);white-space:nowrap}
.mhero-bot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mh-meta{display:flex;gap:16px;flex-wrap:wrap;color:#c3ccd8;font-size:13.5px;align-items:center}
.mh-meta b{color:var(--fg);font-family:var(--f-mono);font-weight:600}
.mh-done{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.mh-done h3{font-size:clamp(22px,3vw,30px);letter-spacing:.04em}
.mh-res{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.mh-res span{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(7,11,18,.7);border:1px solid var(--line2);font-size:13px}
@media (max-width:560px){.mhero-in{padding:14px 14px 16px;min-height:340px}.mhero-bot{flex-direction:column;align-items:stretch}.mhero-bot .row{justify-content:stretch}.mhero-bot .btn.primary{flex:1}}
/* training cards */
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.tcard{display:grid;grid-template-columns:38px minmax(0,1fr);grid-template-rows:auto auto auto;column-gap:10px;row-gap:2px;align-items:center;text-align:left;padding:12px;border-radius:16px;background:var(--glass),var(--bg2);border:1px solid var(--line);transition:transform .18s,border-color .18s,box-shadow .18s}
.tcard .aic{grid-row:1/3;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(180deg,rgba(91,155,255,.22),rgba(91,155,255,.08));color:#9cc2ff}
.tcard b{font-size:14.5px}
.tcard .muted{font-size:12px;line-height:1.3}
.tcard .gains{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.gchip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:rgba(56,178,122,.13);color:#7fe0b2;white-space:nowrap}
.gchip.neg{background:rgba(242,155,56,.12);color:#f7b56b}.gchip.pos{background:rgba(91,155,255,.14);color:#9cc2ff}
.tcard:hover:not(:disabled){transform:translateY(-3px);border-color:var(--line2);box-shadow:0 16px 30px -18px rgba(0,0,0,.9)}
.tcard.on{border-color:var(--gold1);background:linear-gradient(180deg,rgba(255,219,92,.14),rgba(255,219,92,.03)),var(--bg2);opacity:1}
.tcard.on .aic{background:linear-gradient(180deg,var(--gold1),var(--gold2));color:#211600}
.tcard:disabled:not(.on){opacity:.4}
@media (max-width:560px){.tcards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tcard{grid-template-columns:30px minmax(0,1fr);padding:10px;column-gap:8px}.tcard .aic{width:30px;height:30px;border-radius:9px;grid-row:1/2}.tcard .aic .ic{width:17px;height:17px}.tcard>.muted{display:none}.tcard b{font-size:13.5px;line-height:1.15}.tcard .gains{margin-top:6px;gap:4px}.gchip{font-size:10.5px;padding:2px 6px}}
/* fixtures, kpis, profile */
.fxc{border-radius:20px;border-color:var(--line);background:var(--glass),var(--panel);box-shadow:var(--lift)}
.kpis>div{background:var(--glass),rgba(7,11,18,.5);border-color:var(--line);border-radius:14px}
.profile{position:relative;overflow:hidden}
.profile::before{content:"";position:absolute;inset:0 0 auto 0;height:120px;background:radial-gradient(420px 120px at 20% 0%,rgba(255,219,92,.12),transparent);pointer-events:none}
.bar{background:rgba(255,255,255,.06);border:0}
.bar i{background:linear-gradient(90deg,#3f7ef0,#7fb0ff)}
.next-step{border-left:0;padding:12px 14px;border-radius:14px;background:linear-gradient(90deg,rgba(255,219,92,.12),rgba(255,219,92,.02));box-shadow:inset 2px 0 0 var(--gold1)}
.alert{border-radius:18px}
/* report */
.rring{position:relative;width:148px;height:148px;flex:none}
.rring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rring circle{fill:none;stroke-width:9}
.rring .bg{stroke:rgba(255,255,255,.07)}
.rring .fg{stroke-linecap:round;transition:stroke .3s}
.rring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rring-in b{font-family:var(--f-mono);font-weight:600;font-size:44px;line-height:1;letter-spacing:-.02em}
.rring-in small{font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.rgrade{font-family:var(--f-display);font-weight:800;font-size:28px;text-transform:uppercase;letter-spacing:.03em}
/* start */
.start{position:relative;isolation:isolate;background:var(--bg)}
.start-bg{position:fixed;inset:0;width:100%;height:100%;z-index:-2;display:block}
.start::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(7,11,18,.94) 0%,rgba(7,11,18,.7) 45%,rgba(7,11,18,.55) 100%),linear-gradient(0deg,rgba(7,11,18,.9),transparent 50%)}
.start .panel{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02)),rgba(11,17,27,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.logo span{background:linear-gradient(180deg,var(--gold1),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.opt{border-radius:14px;background:var(--glass),rgba(7,11,18,.55)}
.opt.on{border-color:var(--gold1);background:linear-gradient(180deg,rgba(255,219,92,.14),rgba(255,219,92,.02)),rgba(7,11,18,.55)}
/* match screen polish */
.stage{border-radius:22px;box-shadow:0 30px 80px -40px rgba(0,0,0,.95)}
.mbar{background:var(--glass),var(--panel);border-radius:18px}
.sheet{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0)),var(--panel);border-radius:22px;box-shadow:0 40px 100px -30px rgba(0,0,0,.95)}
.sh-head{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01)),var(--panel2)}
.dopt{border-radius:12px;background:var(--glass),var(--bg2);border-color:var(--line2)}
.dopt.on{border-color:var(--gold1);background:linear-gradient(180deg,rgba(255,219,92,.18),rgba(255,219,92,.05)),var(--bg2)}
.cbtn{border-radius:12px;box-shadow:0 10px 24px -12px rgba(0,0,0,.8)}
.cbtn.y{background:linear-gradient(160deg,#ffe27a,#f2b51e)}.cbtn.r{background:linear-gradient(160deg,#ff6b72,#d12f39)}
.fact{background:var(--glass),rgba(7,11,18,.45);border-radius:12px}

/* ===== v5: start, slots, wizard ===== */
.start-in{width:min(1180px,100%);grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:44px;align-items:center;min-height:calc(100vh - 100px)}

.slots{display:flex;flex-direction:column;gap:12px}

.slot-stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}.slot-stats b{color:var(--fg);font-family:var(--f-mono);font-size:13px;font-weight:600}

@media (max-width:860px){.start-in{grid-template-columns:minmax(0,1fr);gap:26px;min-height:0}.start-hero .lede{font-size:15px}}
@media (max-width:560px){.slot{grid-template-columns:56px minmax(0,1fr);gap:12px;padding:14px}.slot-av,.slot-av .avsvg{width:56px;height:56px}.slot-act{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}.slot-act .btn.primary{flex:1}.feat span{font-size:12px;padding:6px 10px}}

function genTRTeams(){

  for(let i=cities.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[cities[i],cities[j]]=[cities[j],cities[i]];}
  const out=[]; let ci=0; const used=new Set();
  for(let t=0;t<4;t++){ const arr=[]; for(let i=0;i<18;i++){ const city=cities[ci++%cities.length]; let nm; do{ nm=city+' '+TR_SUFFIX[Math.floor(r()*TR_SUFFIX.length)]; }while(used.has(nm)); used.add(nm); const [a,b]=TIER_STR[t]; arr.push([nm, Math.round(a+r()*(b-a)), city]); } out.push(arr); }
  return out;
}

    AC=AC||new (window.AudioContext||window.webkitAudioContext)();

    const dur = kind==='long'||kind==='end'?0.55:0.28;

      const t0=AC.currentTime+st; const o=AC.createOscillator(), g=AC.createGain(), lfo=AC.createOscillator(), lg=AC.createGain();
      o.type='sine'; o.frequency.value=2750; lfo.frequency.value=34; lg.gain.value=120; lfo.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(.12,t0+.02); g.gain.setValueAtTime(.12,t0+dur-.05); g.gain.linearRampToValueAtTime(0,t0+dur);
      o.connect(g); g.connect(AC.destination); o.start(t0); lfo.start(t0); o.stop(t0+dur+.02); lfo.stop(t0+dur+.02);
    });

}

function roundRobin(ids){
  const n=ids.length, arr=ids.slice(); const rounds=[];
  for(let r=0;r<n-1;r++){ const rd=[]; for(let i=0;i<n/2;i++){ const a=arr[i], b=arr[n-1-i]; rd.push(r%2?[b,a]:[a,b]); } rounds.push(rd); arr.splice(1,0,arr.pop()); }
  return rounds.concat(rounds.map(rd=>rd.map(([a,b])=>[b,a])));
}
function startSeason(first){
  if(!first){
    S.season++; S.age++;
    if(S.pendingMove){ const to=S.pendingMove; S.pendingMove=null; S.country=to.country; S.contract=to.years||0; if(to.country!==S.nationality){ milestone('yurtdisi'); mail('Sözleşme','Yeni ligine hoş geldin',LEAGUES[to.country].league+' hakem havuzundasın. '+(LEAGUES[to.country].pool==='uefa'?'AFK görevlerin devam ediyor.':'Bu ligdeyken AFK görevleri askıya alındı; DFF kokartın geçerli.'),'fed'); } else mail(NAT().kurul,'Yuvaya dönüş',tierName(4)+' hakem listesine yeniden dahil edildin.','fed'); }
  }
  S.leagueKey = home() ? 'H'+S.tier : S.country;
  const ids=shuffle(leagueTeams(S.leagueKey).map(t=>t.id));
  S.fixtures=roundRobin(ids);
  S.table={}; ids.forEach(id=>S.table[id]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
  S.week=1; S.phase='season'; S.stats={dom:[],intl:[],all:[]}; S.summary=null;
  initAllLeagues(); initWorld(); makeWeekTasks(); save();
}

function fixtureImp(h,a){
  const H=team(h), A=team(a); const tab=sortedTable(); const n=tab.length;
  const ph=tab.findIndex(x=>x.id===h)+1, pa=tab.findIndex(x=>x.id===a)+1;

  return {imp:clamp(Math.round(imp*10)/10,1,5),derby};

function makeFx(o){ return Object.assign({id:uid('fx'),played:false,rating:null,score:null,season:S.season,week:S.week},o); }

function makeWeekTasks(){
  const T={week:S.week,activity:null,matches:[]};
  const lastDom = S.stats.dom.length ? S.stats.dom[S.stats.dom.length-1] : null;
  if(S.suspended>0){ S.suspended--; mail('Hakem Kurulu','Bu hafta görev yok','Son performansın değerlendirildi; bu hafta dinlendiriliyorsun. Antrenmana odaklan.','fed'); }
  else {
    const round=S.fixtures[(S.week-1)%S.fixtures.length];
    const scored=round.map(([h,a])=>({h,a,...fixtureImp(h,a)})).sort((x,y)=>y.imp-x.imp);
    const lr = S.stats.dom.length ? avg(S.stats.dom) : (S.prevAvg||8.2);
    const q=clamp(S.rep/100*.5 + ((S.kurul?S.kurul.trust:50)-50)/220 + (lr-7.9)*.45 + rand()*.35 - (lastDom!==null&&lastDom<7.8?.25:0),0,1);
    const f=scored[Math.round((1-q)*(scored.length-1))];
    const L=home()?null:LEAGUES[S.country];
    T.matches.push(makeFx({kind:'dom',comp:'LIG',compName:leagueName(),home:f.h,away:f.a,imp:f.imp,derby:f.derby,

function poolClubs(min,max){ const out=[]; for(const k in LEAGUES){ if(LEAGUES[k].pool!=='uefa') continue; leagueTeams(k).forEach(t=>{ if(t.str>=min&&t.str<=max) out.push(t); }); } return out.filter(t=>t.country!==S.nationality); }

function assignMidweek(ph){
  const cat=S.uefaCat; const uAvg = S.stats.intl.length?avg(S.stats.intl):8.25;
  const p = .42 + S.rep/280 + (uAvg-8.2)*.4;
  if(ph!=='F' && !chance(clamp(p,.25,.85))) return null;
  if(ph==='NT'){
    const y=summerYear(); const nextWC=(y-2030)%4===0, nextEU=(y-2028)%4===0;
    let comp = cat<=1 ? (chance(.5)?'U21Q':'UNL') : (nextWC?'WCQ':nextEU?'ECQ':'UNL');
    const pool=NATIONS.filter(n=>n[2]==='UEFA'&&n[0]!==myNT()).map(n=>mkTeam(n[0],n[1],'',n[2],true));
    const strong = cat>=3 ? pool.filter(t=>t.str>=74) : pool;
    const [h,a]=pair(strong);
    const isU21 = comp==='U21Q';
    return makeFx({kind:'mid',comp,compName:COMPS[comp].name,home:h.id,away:a.id,u21:isU21,imp:clamp(2+cat*.6+(h.str+a.str-150)/20,1,5),derby:false,vr:!isU21,glt:false,lvl:isU21?2:3+Math.min(cat,2)*.5,fee:COMPS[comp].fee,stage:isU21?'U21':'Grup maçı'});
  }
  if(ph==='F'){
    let comp=null;
    if(cat>=4 && uAvg>=8.65 && S.rep>=75 && chance(.55)) comp='UCL';
    else if(cat>=4 && uAvg>=8.5 && chance(.5)) comp='UEL';
    else if(cat>=3 && uAvg>=8.45 && chance(.45)) comp='UECL';
    if(!comp) return null;
    const pool = comp==='UCL'?poolClubs(84,99):comp==='UEL'?poolClubs(76,88):poolClubs(68,82);
    const [h,a]=pair(pool);
    mail('AFK Hakem Komitesi','Final ataması: '+COMPS[comp].name,'Tebrikler. Sezonun en kritik maçı için seçildin. Bu görev, kariyerinin dönüm noktası olabilir.','uefa');
    return makeFx({kind:'mid',comp,compName:COMPS[comp].name,home:h.id,away:a.id,imp:5,derby:false,vr:true,glt:true,lvl:6,fee:COMPS[comp].fee*2,stage:'Final',final:true});
  }
  if(ph==='Q' && cat>=4 && chance(.35)){
    const [h,a]=pair(poolClubs(80,99));
    return makeFx({kind:'mid',comp:'USC',compName:COMPS.USC.name,home:h.id,away:a.id,imp:5,derby:false,vr:true,glt:true,lvl:6,fee:COMPS.USC.fee,stage:'Tek maç',final:true});
  }
  const ko=['KOPO','R16','QF','SF'].includes(ph);
  let opts;
  if(cat===0) opts=ko?['UYL']:(ph==='Q'||ph==='PO')?['UECL','UYL']:['UYL'];
  else if(cat===1) opts=(ph==='Q'||ph==='PO')?['UECL','UEL']:['UECL'];
  else if(cat===2) opts=(ph==='Q'||ph==='PO')?['UEL','UCL']:ko?['UECL','UEL']:['UEL','UECL'];
  else if(cat===3) opts=ko?(ph==='QF'||ph==='SF'?['UEL','UECL']:['UEL','UCL']):['UCL','UEL'];
  else opts=['UCL'];
  if((ph==='QF'||ph==='SF') && uAvg<8.3) return null;
  const comp=opts[0]&&chance(.65)?opts[0]:pick(opts);
  const youth = comp==='UYL';
  const range = comp==='UCL'?(ko?[82,99]:[74,99]):comp==='UEL'?[70,86]:comp==='UECL'?[62,78]:[60,99];
  const [h,a]=pair(poolClubs(range[0],range[1]));
  const lvl = {UYL:2,UECL:3,UEL:4,UCL:5}[comp] + (ko?.5:0);
  return makeFx({kind:'mid',comp,compName:COMPS[comp].name,home:h.id,away:a.id,youth,imp:clamp((youth?1.5:2)+lvl*.4+(ko?1:0),1,5),derby:false,vr:!youth&&!(comp==='UECL'&&(ph==='Q'||ph==='PO')),glt:comp==='UCL'||comp==='UEL',lvl,fee:COMPS[comp].fee*(ko?1.3:1),stage:PHASE_NAMES[ph]});
}

  if(!S.fifa && prevTier===4 && dom.length>=8){
    if(dAvg>=8.3 && S.age<=38 && S.english>=2){ S.fifa=true; S.uefaCat=0; lines.push(['up','DFF kokartı kazandın! AFK Kategori 3 ile Avrupa yolu açıldı.']); milestone('fifa'); }

function recordIn(T,h,a,gh,ga){ const H=T[h],A=T[a]; if(!H||!A) return; H.p++;A.p++;H.gf+=gh;H.ga+=ga;A.gf+=ga;A.ga+=gh;
  const rH=gh>ga?'G':gh<ga?'M':'B', rA=gh>ga?'M':gh<ga?'G':'B';
  if(rH==='G'){H.w++;A.l++;H.pts+=3;} else if(rH==='M'){A.w++;H.l++;A.pts+=3;} else {H.d++;A.d++;H.pts++;A.pts++;}
  H.form=(H.form||[]).concat(rH).slice(-5); A.form=(A.form||[]).concat(rA).slice(-5); }
function sortT(T){ return Object.entries(T).sort((a,b)=>b[1].pts-a[1].pts||(b[1].gf-b[1].ga)-(a[1].gf-a[1].ga)||b[1].gf-a[1].gf).map(([id,r],i)=>({id,pos:i+1,...r})); }
function leagueKeysAll(){ const ks=['H0','H1','H2','H3','H4']; for(const k in LEAGUES){ const L=LEAGUES[k]; if(!L.league||L.teams.length<8||k===S.nationality) continue; ks.push(k); } return ks; }
function leagueLabel(k){ if(/^H\d$/.test(k)) return NAT().tiers[+k[1]]; return LEAGUES[k].league; }
function leagueFlag(k){ return /^H/.test(k)?S.nationality:k; }
function initAllLeagues(){
  S.lg={}; leagueKeysAll().forEach(k=>{ if(k===S.leagueKey) return; const ids=shuffle(leagueTeams(k).map(t=>t.id)); const T={}; ids.forEach(id=>T[id]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,form:[]}); S.lg[k]={fx:roundRobin(ids),table:T}; });
  for(let w=1;w<S.week;w++) simOtherLeagues(w);
}
function simOtherLeagues(w){ if(!S.lg) return; for(const k in S.lg){ const L=S.lg[k]; L.fx[(w-1)%L.fx.length].forEach(([h,a])=>{ const [x,y]=simScore(h,a,true); recordIn(L.table,h,a,x,y); }); } }
function tableOf(k){ if(k===S.leagueKey) return S.table; if(!S.lg||!S.lg[k]) initAllLeagues(); return S.lg[k]?S.lg[k].table:null; }
let LG_VIEW=null;

  if(top){ if(pos===1) return ['champ','Şampiyon']; if(pos<=4) return ['ucl','Elitler Ligi']; if(pos<=6) return ['uel','Avrupa / Kıta Kupası']; if(pos>n-3) return ['rel','Düşme']; return null; }

function sceneBusy(sc){ return (M&&M.modal)||['goal','card','buildup'].includes(sc.mode); }
function sceneQueue(sc,ev){ (sc.evQ=sc.evQ||[]).push(ev); if(M) M.holdQ=true; }
function sceneNext(sc){ if(!sc) return false; const ev=(sc.evQ||[]).shift(); if(!sc.evQ||!sc.evQ.length) { if(M) M.holdQ=false; } if(!ev) return false; if(ev.k==='goal') sceneGoal(sc,ev.side,ev.p,true); else sceneCard(sc,ev,true); return true; }
function cardShow(side,p,red,second,coach){
  const t=sideTeam(side); const label=coach?squad(t).coach+' (TD)':pl(p);
  if(coach||!SC){ showCardFx(red,second,label,t.name); return; }
  const ev={k:'card',side,p,red,second,label,team:t.name};
  if(sceneBusy(SC)) sceneQueue(SC,ev); else sceneCard(SC,ev);
}
function sceneCard(sc,ev,fromQ){
  const pl0=sc.pl.find(q=>q.side===ev.side&&q.num===ev.p.no&&!q.gone&&!q.leaving)||nearestTo(sc.pl.filter(q=>q.side===ev.side&&q.role!=='GK'&&!q.gone&&!q.leaving),sc.ball.x,sc.ball.y);
  if(!pl0){ showCardFx(ev.red,ev.second,ev.label,ev.team); return; }
  pl0.num=ev.p.no; const r=sc.refs[0]; const d=v2n(r.x-pl0.x,r.y-pl0.y);
  sc.card={...ev,pl:pl0,t:0,tx:pl0.x+d[0]*1.7,ty:pl0.y+d[1]*1.7,shown:false}; sc.mode='card'; sc.ball.owner=null; sc.ball.fl=null; sc.gather=[pl0.x,pl0.y];
  if(M) M.cardHold=true;
}
function cardAI(sc,dt){
  const C=sc.card; if(!C){ sc.mode='play'; return; } C.t+=dt; const r=sc.refs[0], p=C.pl;
  sc.pl.forEach(q=>{ if(q===p||q.gone) return; if(q.leaving){ steer(q,q.x,-4,dt,2); if(q.y<-3) q.gone=true; return; } const dd=Math.hypot(q.x-p.x,q.y-p.y); if(q.side===C.side&&dd<22&&q.role!=='GK'&&q.i%2===0){ const a=q.i*.8; steer(q,p.x+Math.cos(a)*3,p.y+Math.sin(a)*3,dt,3); setPose(q,'protest',.6); } else steer(q,q.x,q.y,dt,.6); });
  if(!C.arr){ steer(r,C.tx,C.ty,dt,8); steer(p,p.x,p.y,dt,1); if(Math.hypot(r.x-C.tx,r.y-C.ty)<.7||C.t>3.5){ C.arr=true; C.t0=C.t; } }
  else { const ta=C.t-C.t0+1; r.speed=0; r.face=v2n(p.x-r.x,p.y-r.y); p.face=v2n(r.x-p.x,r.y-p.y); p.speed=0; const k=Math.min(1,(ta-1)/.22);
    r.pose={P:POSES.cardUp,k}; r.card=C.red?'r':'y'; p.pose={P:C.red?POSES.faceHold:POSES.protest,k:Math.min(1,(ta-1.1)/.3)};
    if(!C.shown){ C.shown=true; showCardFx(C.red,C.second,C.label,C.team); whistle(); } }
  if(C.arr && C.t-C.t0>2.4){ r.pose=null; r.card=null; p.pose=null; sc.pl.forEach(q=>{ if(!q.leaving) q.pose=null; }); if(C.red){ p.leaving=true; p.hl=false; } sc.card=null; if(M) M.cardHold=false; sc.mode='stopped'; sc.gather=null;
    if(!sceneNext(sc)) sceneResume(sc); }
}

  for(let i=0;i<nMaj;i++){ let t; let g=0; do{ t=wpick(weights); }while((used[t]||0)>=2&&g++<20); used[t]=(used[t]||0)+1; m.schedule.push({min:minPick(),kind:'inc',type:t,side:chance(H.str/(H.str+A.str))?0:1}); }

function simulateMinute(){

// ---------- incident evaluation ----------
function pushLog(inc,e){ Object.defineProperty(e,'inc',{value:inc,enumerable:false}); M.log.push(e); }
function sameAns(a,b){ return a.d===b.d && (b.c===undefined || a.c===b.c); }
function evaluate(inc,ans){
  const C=inc.correct;
  if(sameAns(ans,C)) return 'dogru';
  if(inc.accept.some(x=>sameAns(ans,x))) return 'kabul';
  if(inc.partial.some(x=>sameAns(ans,x))) return 'kismen';
  if(ans.d===C.d){
    const redInv = (C.c==='kirmizi')!==(ans.c==='kirmizi');
    if(redInv) return 'hata';
    if(inc.cardCritical && ans.c!==C.c) return 'hata';
    return 'kismen';
  }
  return 'hata';
}
function varCheck(inc,ans,verdict){
  if(!M.fx.vr) return null;
  const C=inc.correct;
  if(verdict==='dogru'||verdict==='kabul'){ if((inc.reviewable||inc.redReview) && !inc.borderline && chance(.04)) return 'yanlis'; return null; }
  const decWrong = ans.d!==C.d;
  const redWrong = (C.c==='kirmizi')!==(ans.c==='kirmizi');
  if(decWrong && inc.reviewable) return inc.factual ? 'direkt' : (chance(.9)?'ofr':null);
  if(redWrong && (inc.reviewable||inc.redReview) && inc.cards.kirmizi) return chance(.88)?'ofr':null;
  return null;
}
function favorScore(inc,ans){
  let s=0; const d=ans.d;
  if(['penalti','gol_gecerli','gol','tekrar'].includes(d)) s+=2; if(['serbest','faul','direkt','endirekt','avantaj'].includes(d)) s+= (inc.type==='gol_oncesi_faul'||inc.type==='kaleci_engelleme'?-1:1);
  if(d==='simulasyon') s-=1;
  const cd=ans.c&&inc.cards[ans.c]; if(cd){ s+= (cd.side==='D'?1:-1)*(cd.red?2:.5); }
  return s;
}
function applyFinal(inc,ans){
  const side=inc.ai, oside=inc.di;
  const eff=inc.onD[ans.d];
  const cd=ans.c&&ans.c!=='yok'?inc.cards[ans.c]:null;
  if(cd) giveCard(cd.side==='A'?side:oside,cd.p,!!cd.red);
  const decLabel=labelOf(inc,'d',ans.d);
  if(eff==='goalA'){ goal(side, inc.goalScorer, inc.type==='ofsayt_gol'?'Ofsayt itirazına rağmen geçerli':''); }
  else if(eff==='penA'){ M.penalties++; S.totals.pens++; stopAdd('Penaltı',ri(50,80)); feed(`<b>PENALTI!</b> ${esc(sideTeam(side).name)} lehine penaltı.`,'dec'); if(chance(.28)) M.queue.unshift({kind:'pen',side}); else { if(chance(.77)) goal(side,pickPlayer(M,side,['FWD']),'penaltıdan'); else feed(`Penaltı kaçtı! Kaleci uzandı.`,'sys'); } }
  else if(eff==='retakeA'){ feed('Penaltı tekrarlanacak.','dec'); if(chance(.76)) goal(side,pickPlayer(M,side,['FWD']),'tekrarlanan penaltıdan'); else feed('Tekrarlanan penaltıda kaleci kurtardı!','sys'); }
  else feed(`Karar: ${esc(decLabel)}`,'dec');
}

function randomWrong(inc){

// ---------- rating ----------
function computeRating(){
  let r=8.15; const w=M.fx.imp>=4?1.25:1; let errors=0, majors=0;
  for(const d of M.log){
    if(d.cat==='major'){ majors++; const t={dogru:.09,kabul:.03,kismen:-.16,hata:-.5,var:-.14,israr:-.7,durdu:.12}[d.v]; r+= t<0?t*w:t; if(d.v==='hata'||d.v==='israr') errors++; if(d.late) r-=.04; }
    else if(d.cat==='quick') r+= d.v==='dogru'?.03:-.13;
    else if(d.cat==='mgmt') r+= d.v==='dogru'?.06:d.v==='kismen'?-.04:-.2;
    else if(d.cat==='uz') r+= d.v==='dogru'?.03:d.v==='kabul'?.01:-.07;
  }
  if(M.tempMax>88) r-=.15; else if(M.tempMax>75) r-=.05;
  const avgT=M.tempN?M.tempSum/M.tempN:50; if(avgT<40) r+=.04;
  if(errors===0 && M.fx.lvl>=4) r+=.1;
  if(errors===0 && M.fx.imp>=4) r+=.05;
  r+=rf(-.04,.04);
  return Math.round(clamp(r,5.8,9.7)*10)/10;
}

const V3={sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];},lerp:(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]};
const NEAR=.5;
function camera(pos,target,fov,W,H,dpr){ const f=V3.norm(V3.sub(target,pos)); let r=V3.cross(f,[0,0,1]); if(Math.hypot(r[0],r[1],r[2])<1e-4) r=[1,0,0]; r=V3.norm(r); const u=V3.cross(r,f); return {pos,f,r,u,F:W*fov,W,H,dpr:dpr||1}; }
function tc(c,p){ const d=V3.sub(p,c.pos); return [V3.dot(d,c.r),V3.dot(d,c.u),V3.dot(d,c.f)]; }
function pj(c,q){ return [c.W/2+c.F*q[0]/q[2], c.H/2-c.F*q[1]/q[2], q[2]]; }
function P(c,p){ const q=tc(c,p); return q[2]<NEAR?null:pj(c,q); }

const netBulge = n => !n?0: n.t<.25? Math.sin(n.t/.25*Math.PI/2)*.9 : Math.max(0,.9*(1-(n.t-.25)/1.2));
function crowdRoar(){
  if(!S||!S.settings.sound) return;
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const len=AC.sampleRate*3, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const src=AC.createBufferSource(); src.buffer=buf; const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=700; bp.Q.value=.6; const g=AC.createGain(); const t0=AC.currentTime;

// live goal sequence: carry, shot, keeper beaten, net bulge, celebration
function sceneGoal(sc,side,p){
  if(!sc) return;
  if(!arguments[3] && sceneBusy(sc)){ sceneQueue(sc,{k:'goal',side,p}); return; }
  const d=sdir(sc,side), gx=d>0?105:0;
  sc.forced=null; sc.spots=null; sc.mark=null; sc.refTarget=null; sc.gather=null; sc.flash=null;
  sc.pl.forEach(q=>{ q.keepDown=false; q.fall=0; q.pose=null; q.t=null; q.hl=false; });
  const mates=sc.pl.filter(q=>q.side===side&&q.role!=='GK'&&!q.gone&&!q.leaving);
  let sp=p?mates.find(q=>q.num===p.no):null; if(!sp) sp=nearestTo(mates.filter(q=>q.role==='F'),gx,34)||mates[0]; if(p) sp.num=p.no;
  const shotPos=[gx-d*rf(11,16),34+rf(-8,8)], target=[gx+d*1.15,34+(chance(.5)?1:-1)*rf(1.8,3.1)];
  sc.goal={side,sp,shotPos,target,d,gx,t:0,gk:sc.pl.find(q=>q.side!==side&&q.role==='GK'),label:esc(sideTeam(side).name)+(p?' · '+esc(p.name):'')};
  sc.mode='goal'; sc.mt=0; sc.ball.fl=null; sc.ball.owner=null; sc.net=null;
  if(M) M.goalHold=true;
}
function goalAI(sc,dt){
  const G=sc.goal; if(!G){ kickoffPositions(sc,0); return; } G.t+=dt; const b=sc.ball, sp=G.sp, d=G.d;
  const T1=1.7,T2=1.95,T3=2.35,END=5.6;
  sc.pl.forEach(q=>{ if(q===sp||q===G.gk||q.gone||q.leaving) return;
    if(G.t<T3){ if(q.side===G.side) steer(q,G.gx-d*(13+(q.i%4)*5),34+((q.i%5)-2)*8,dt,5.6); else steer(q,G.gx-d*(5+(q.i%4)*2.5),34+((q.i%5)-2)*6,dt,6); }
    else if(q.side===G.side){ steer(q,sp.x-d*(1.2+(q.i%3)*.9),sp.y+((q.i%4)-1.5)*1.4,dt,6.8); if(G.t>T3+1.2){ const near=Math.hypot(q.x-sp.x,q.y-sp.y)<5; q.pose={P:near?POSES.celebrate:POSES.armUp,k:near?.45+.55*Math.abs(Math.sin(G.t*6.5+q.i)):.7}; } }
    else { steer(q,q.x,q.y,dt,.6); q.pose={P:POSES.slump,k:Math.min(1,(G.t-T3)*2)}; } });
  const gk=G.gk;
  if(G.t<T1){ steer(sp,G.shotPos[0],G.shotPos[1],dt,7.2); b.x=sp.x+sp.face[0]*.55; b.y=sp.y+sp.face[1]*.55; b.z=0; steer(gk,G.gx-d*2.5,34+(b.y-34)*.3,dt,3); }
  else if(G.t<T2){ const k=(G.t-T1)/(T2-T1); sp.speed=Math.max(.8,(sp.speed||0)*.92); sp.face=v2n(G.target[0]-sp.x,G.target[1]-sp.y); sp.x+=sp.face[0]*sp.speed*dt*.5; sp.y+=sp.face[1]*sp.speed*dt*.5; sp.pose={P:kickPose('shot',.45*k),k:Math.min(1,k*4)}; b.x=sp.x+sp.face[0]*.5; b.y=sp.y+sp.face[1]*.5; }
  else if(G.t<T3){ if(!G.from){ G.from=[b.x,b.y]; G.curve=(chance(.5)?1:-1)*rf(.8,2.2); } const kk=Math.min(1,(G.t-T2)/.35); sp.pose={P:kickPose('shot',.45+.55*kk),k:Math.max(0,1-Math.max(0,kk-.8)*5)}; sp.speed=.6;
    const k=(G.t-T2)/(T3-T2); b.x=G.from[0]+(G.target[0]-G.from[0])*k; b.y=G.from[1]+(G.target[1]-G.from[1])*k+G.curve*4*k*(1-k); b.z=1.1*k+.9*4*k*(1-k)*.5;
    const dv=G.target[1]>34?-1:1; gk.face=[-d,0]; gk.pose={P:POSES.gkDive,k:Math.min(1,k*1.6)}; gk.fall=Math.min(.95,k*1.4); gk.fallDir=[0,dv]; steer(gk,gk.x,34+dv*1.8,dt,4); }
  else { if(!G.scored){ G.scored=true; sc.net={end:d>0?1:0,t:0}; matchBanner('goal','GOL!',G.label); crowdRoar(); haptic('success'); }
    b.x=G.target[0]+d*.4; b.z=Math.max(.11,(b.z||0)-dt*2.5);
    if(!G.cel) G.cel=['slide','airplane','jump'][Math.floor(Math.random()*3)];
    const corner=[G.gx-d*3,G.target[1]>34?64:4], dc=Math.hypot(corner[0]-sp.x,corner[1]-sp.y), ck=Math.min(1,Math.max(0,G.t-T3-.4)*3);
    if(G.cel==='slide' && (G.sliding || (dc<6.5 && sp.speed>3))){ if(!G.sliding){ G.sliding=true; sp.slV=[sp.vx,sp.vy]; } const dk=Math.exp(-1.6*dt); sp.slV[0]*=dk; sp.slV[1]*=dk; sp.x+=sp.slV[0]*dt; sp.y+=sp.slV[1]*dt; sp.speed=0; sp.vx=sp.vy=0; sp.pose={P:POSES.kneeSlide,k:Math.min(1,(sp.pose&&sp.pose.P===POSES.kneeSlide?sp.pose.k:0)+dt*5)}; }
    else { steer(sp,corner[0],corner[1],dt,7.5); if(G.cel==='airplane'||G.cel==='slide') sp.pose={P:POSES.airplane,k:ck*(G.cel==='slide'?.6:1)}; else sp.pose={P:POSES.celebrate,k:ck*(dc<2?.5+.5*Math.abs(Math.sin(G.t*7)):.7)}; } }
  if(sc.net) sc.net.t+=dt;
  if(G.t>END){ sc.goal=null; sc.net=null; gk.fall=0; gk.pose=null; sc.pl.forEach(q=>q.pose=null); kickoffPositions(sc,1-G.side); if(M) M.goalHold=false; sceneNext(sc); }
}

let TIMER_T0=0, HIDDEN_AT=0, FBT=null;

function startTimer(sec,onEnd,elId,labId){

// live incident: build-up on the pitch, inline positioning, then decision sheet
function liveIncident(inc){
  curInc=inc; M.modal=true; sceneBuildup(SC,inc);
  const sp=SPOTS[inc.pos];
  const go=()=>{ hidePrompt(); sceneBuildGo(SC,()=>{ whistle(); matchBanner('whistle','Düdük',esc(inc.title)); setTimeout(()=>incidentMain(inc),450); }); };
  if(sp && S.settings.pos){
    const keys=shuffle(['best','ok','bad']), L=['A','B','C'];
    SC.spots=keys.map((k,i)=>{ const w=SC.map(sp[k][0],sp[k][1]); return {x:w[0],y:w[1],l:L[i],k}; });
    showPrompt(`<div class="pr-head"><span class="pr-tag">${inc.minute} · Konum al</span><span class="num" id="ptLab"></span></div><p class="pr-q">${esc(sp.q)}</p>
      <div class="pr-opts">${SC.spots.map(s=>`<button class="posopt" data-k="${s.k}"><span class="L">${s.l}</span><span>${esc(sp.txt[s.k])}</span></button>`).join('')}</div><div class="timer" id="ptmr"><i></i></div>`);
    const choose=k=>{ stopTimer(); haptic('light'); inc.posQ=k; M.posTotal++; if(k==='best') M.posGood++; inc.refPos=sp[k]; SC.refTarget=SC.map(sp[k][0],sp[k][1]); SC.spots=SC.spots.filter(s=>s.k===k); setTimeout(go,350); };
    document.querySelectorAll('#prompt .posopt').forEach(b=>b.onclick=()=>choose(b.dataset.k));

}

function trCard(a){

  if(a.id==='dinlen') g=`<div class="tr-g"><span>Enerji</span><b class="num">${Math.round(S.energy)}</b><i>→</i><b class="num hi">${Math.min(100,Math.round(S.energy+a.energy))}</b></div>`;

      news('kurul',`Şike soruşturması: ${S.name} 10 hafta görevden uzaklaştırıldı`,`Federasyon, hakemin şüpheli maçlarla ilgili bağlantılarını incelemeye aldı. Hakeme ${money(fine)} para cezası verildi.`);
      addPost({a:PRESS[2],text:`Şike soruşturması patladı. ${S.name} için ciddi iddialar var. Bir daha düdük çalabilecek mi? #hakem`,likes:engage(900),rts:engage(400),aboutMe:true});
      mail(kurulName(),'Disiplin kararı','Hakkındaki şike soruşturması sonucu 10 hafta görev verilmeyecek ve '+money(fine)+' para cezası ödeyeceksin. Bir kez daha tekrarlanırsa lisansın iptal edilecek.','fed');
      toast('Soruşturma! 10 hafta men, '+money(fine)+' ceza');
    } else B.susp=clamp(B.susp-2,0,100);
  }
  return null;
}

let AD_BUSY=false, LAST_INT=0, MATCH_N=0;
async function rewarded(label,cb){
  if(isPremium()){ cb(); return; }
  if(!adsOn()||AD_BUSY) return;
  AD_BUSY=true; toast('Reklam yükleniyor…');
  let ok=false; try{ ok=await NV().rewarded(); }catch(e){}
  AD_BUSY=false;
  if(ok) cb(); else toast('Reklam şu an yüklenemedi ya da yarıda kapandı. Biraz sonra tekrar dene.');
}
function adBtn(id,label,extra){

  return `<button class="btn sm v11-ad" id="${id}" ${extra||''}>${isPremium()?ic('star'):`<svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${V11G.ad}</svg>`}<span>${label}</span>${isPremium()?'<small>Premium</small>':''}</button>`;
}
function v11AfterReport(){

async function buyPremium(){

// ---------- boot ----------
function pauseForBackground(){
  HIDDEN_AT=Date.now();
  if(M && !M.done && !M.auto && !M.paused && $('#bPause')){ M.paused=true; $('#bPause').textContent='Devam'; }
  if(S) save();
}
function resumeFromBackground(){ if(HIDDEN_AT && TIMER) TIMER_T0+=Date.now()-HIDDEN_AT; HIDDEN_AT=0; }
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pauseForBackground(); else resumeFromBackground(); });
function handleBack(){
  if(!$('#modal').hidden) return;                       // decisions cannot be skipped
  const ov=$('#overlay');
  if(!ov.hidden){
    if($('#bBack')) return $('#bBack').click();          // pre-match: leave
    if($('#bDone')) return $('#bDone').click();          // report: continue
    if(M && !M.done && $('#bPause')) return $('#bPause').click(); // live match: pause/resume
    return;
  }
  if(S && TAB!=='merkez'){ TAB='merkez'; render(); return; }
  const A=PLUG('App'); if(A) A.minimizeApp ? A.minimizeApp() : A.exitApp();
}
async function nativeInit(){
  if(!CAP) return;
  try{ const P=PLUG('Preferences'); if(P){ for(const k of [OLD_KEY,slotKey(1),slotKey(2),slotKey(3)]){ const r=await P.get({key:k}); if(r && r.value) NSAVE[k]=r.value; } } }catch(e){}
  try{ const A=PLUG('App'); if(A){ A.addListener('backButton',handleBack); A.addListener('pause',pauseForBackground); A.addListener('resume',resumeFromBackground); } }catch(e){}
  try{ const SB=PLUG('StatusBar'); if(SB){ SB.setStyle({style:'DARK'}); SB.setBackgroundColor && SB.setBackgroundColor({color:'#101824'}); } }catch(e){}
  try{ const SP=PLUG('SplashScreen'); if(SP) setTimeout(()=>SP.hide(),250); }catch(e){}
}
async function boot(data){
  await nativeInit(); migrateOld();
  if(data && data.save){ S=migrateSave(data.save); SLOT=S.slot||1; ensureRegistry(); }
  render();
}
window.claude?.hot?.snapshot?.(()=>({save:S}));
if(window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? {});
</script>
